VIEWS.users=()=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div><b>User credentials</b><div class="mut" style="font-size:11px">Create separate logins for Principal, Staff, Teachers and Parents. Each role sees its own dashboard.</div></div><button class="btn pri" onclick="openUserForm()">Add user</button></div>
 ${tbl(['Username','Name','Role / group','Linked to','Status',''],S.users.map(u=>{const grp=u.groupId?(S.groups||[]).find(x=>x.id===u.groupId):null;return`<tr><td><b>${esc(u.username)}</b></td><td>${esc(u.name)}</td><td><span class="badge">${u.role}</span>${grp?` <span class="badge">${esc(grp.name)}</span>`:''}${u.isApprover?' <span class="badge ok">Approver</span>':''}</td><td>${u.role==='Teacher'?esc((empOf(u.linkId)||{}).name||'-'):u.role==='Parent'?esc((u.children||[]).map(id=>(stuOf(id)||{}).name).filter(Boolean).join(', ')||'-'):'-'}</td><td>${u.active?'<span class="badge ok">Active</span>':'<span class="badge dan">Disabled</span>'}</td>
 <td style="white-space:nowrap"><button class="btn sm" onclick="openUserForm('${u.id}')">Edit</button> <button class="btn sm" onclick="resetPw('${u.id}')">Reset password</button> <button class="btn sm" onclick="toggleApprover('${u.id}')">${u.isApprover?'Remove approver':'Make approver'}</button> <button class="btn sm" onclick="toggleUser('${u.id}')">${u.active?'Disable':'Enable'}</button> <button class="btn sm dan" onclick="delUser('${u.id}')">Delete</button></td></tr>`}).join(''))}
 <p class="mut" style="font-size:11px;margin-top:10px">Logins live in this browser's saved data (or your backup file). This suits an office computer; for internet-facing use, add a server with hashed passwords. Set up named rights groups under User groups & rights.</p></div>`;
function openUserForm(id){
  const u=id?S.users.find(x=>x.id===id):{username:'',name:'',role:'Teacher',password:'',linkId:'',children:[],active:true};
  openModal(id?'Edit user':'Add user',`<form onsubmit="saveUser(event,'${id||''}')" class="grid grid-cols-2 gap-3">
   ${fld('Role *',`<select class="inp" name="role" id="uRole" onchange="userRoleUI()">${opt(['Admin','Principal','Staff','Teacher','Parent'],x=>x,x=>x,u.role)}</select>`)}${fld('Full name *',`<input class="inp" name="name" required value="${esc(u.name)}">`)}
   ${fld('Username / email *',`<input class="inp" name="username" required value="${esc(u.username)}">`)}${fld(id?'New password (blank = keep)':'Password * (min 6)',`<input class="inp" type="text" name="password" ${id?'':'required'} minlength="6">`)}
   <div id="uTeacher" class="col-span-2">${fld('Teacher profile',`<select class="inp" name="linkId"><option value="">- select staff -</option>${opt(S.employees,e=>e.id,e=>e.name+' ('+e.role+')',u.linkId)}</select>`)}</div>
   <div id="uParent" class="col-span-2">${fld('Children (hold Ctrl / Cmd for several)',`<select class="inp" name="children" multiple style="min-height:110px">${opt(S.students,s=>s.id,s=>s.name+' ('+clsName(s.classId)+')','')}</select>`)}</div>
   <div class="col-span-2" style="text-align:right"><button type="button" class="btn" onclick="closeModal()">Cancel</button> <button class="btn pri">Save user</button></div></form>`);
  if(u.children)[...document.querySelectorAll('[name=children] option')].forEach(o=>{if(u.children.includes(o.value))o.selected=true});userRoleUI();
}
function userRoleUI(){const r=$('#uRole').value;$('#uTeacher').style.display=r==='Teacher'?'':'none';$('#uParent').style.display=r==='Parent'?'':'none'}
function saveUser(e,id){e.preventDefault();const F=new FormData(e.target),f=Object.fromEntries(F.entries()),kids=F.getAll('children'),un=f.username.trim().toLowerCase();
  if(S.users.some(u=>u.username.toLowerCase()===un&&u.id!==id)){alert('That username is already taken.');return}
  if(f.role==='Teacher'&&!f.linkId){alert('Select the teacher profile.');return}if(f.role==='Parent'&&!kids.length){alert('Select at least one child.');return}
  if(f.password&&f.password.length<6){alert('Password needs at least 6 characters.');return}
  const base={username:f.username.trim(),name:f.name.trim(),role:f.role,linkId:f.role==='Teacher'?f.linkId:undefined,children:f.role==='Parent'?kids:undefined};
  if(id){const u=S.users.find(x=>x.id===id);if(u.id===CU.id&&f.role!==u.role){alert('You cannot change your own role.');return}Object.assign(u,base);if(f.password)u.password=f.password}
  else S.users.push({id:uid('U'),...base,password:f.password,active:true});
  persist();closeModal();render();toast('User saved')}
function resetPw(id){const u=S.users.find(x=>x.id===id),p=prompt('New password for '+u.username+' (min 6 characters):','');if(p===null)return;if(p.length<6){alert('Too short.');return}u.password=p;persist();toast('Password reset')}
function toggleApprover(id){const u=S.users.find(x=>x.id===id);u.isApprover=!u.isApprover;persist();render();toast(u.isApprover?'Marked as approver (checker)':'Approver right removed')}
function toggleUser(id){const u=S.users.find(x=>x.id===id);if(u.id===CU.id){alert('You cannot disable your own account.');return}u.active=!u.active;persist();render()}
function delUser(id){const u=S.users.find(x=>x.id===id);if(u.id===CU.id){alert('You cannot delete your own account.');return}
  if(u.role==='Admin'&&S.users.filter(x=>x.role==='Admin'&&x.active).length<2){alert('Keep at least one active Administrator.');return}
  if(confirm('Delete login '+u.username+'?')){S.users=S.users.filter(x=>x.id!==id);persist();render()}}
function openPwModal(){openModal('Change my password',`<form onsubmit="changePw(event)" class="grid gap-3">${fld('Current password',`<input class="inp" type="password" name="cur" required>`)}${fld('New password (min 6)',`<input class="inp" type="password" name="n1" required minlength="6">`)}${fld('Repeat new password',`<input class="inp" type="password" name="n2" required minlength="6">`)}<div style="text-align:right"><button class="btn pri">Update password</button></div></form>`)}
function changePw(e){const f=fd(e);if(f.cur!==CU.password){alert('Current password is wrong.');return}if(f.n1!==f.n2){alert('New passwords do not match.');return}CU.password=f.n1;persist();closeModal();toast('Password updated')}

function eraseDemoData(){
  if(!confirm('This permanently erases ALL sample students, staff, classes, fee records, marks, leave, attendance and accounting entries. Your own login and the institution details above are kept. This cannot be undone - use "Export backup" first if you want a copy. Continue?'))return;
  if(!confirm('Are you absolutely sure? This is your last chance to cancel.'))return;
  S.students=[];S.classes=[];S.employees=[];S.results=[];S.receipts=[];S.feeInvoices=[];S.advances=[];S.payroll=[];
  S.staffLeaves=[];S.leaveAllocOverrides=[];S.staffAttendance=[];S.stack=[];S.vouchers=[];S.assets=[];S.banks=[];
  S.gl.forEach(a=>a.opening=0);
  S.users=S.users.filter(u=>u.id===CU.id);
  S.seq={stu:1001,vch:1,rcp:0,stk:0,pay:0,fa:1,bnk:1,adv:101,emp:101};
  persist();render();toast('Sample data erased - your login and institution details were kept.');
}
function saveInst(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target).entries()),file=$('#logoFile').files[0],signFile=$('#pSignFile')&&$('#pSignFile').files[0];
  const done=(logo,sign)=>{Object.assign(S.inst,{name:f.name.trim(),regNo:f.regNo,pan:f.pan,phone:f.phone,email:f.email,website:f.website,address:f.address,district:f.district||'',province:f.province||'',issueDateBs:f.issueDateBs||''});if(logo)S.inst.logo=logo;if(sign)S.inst.principalSign=sign;persist();render();toast('Settings saved')};
  const readAs=file=>new Promise(res=>{if(!file){res('');return}const rd=new FileReader();rd.onload=()=>res(rd.result);rd.readAsDataURL(file)});
  Promise.all([readAs(file),readAs(signFile)]).then(([logo,sign])=>done(logo,sign))}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='TOPPERS_ERP_BACKUP_'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded')}
function importData(inp){const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||d.v!==2||!Array.isArray(d.gl)||!Array.isArray(d.vouchers))throw 0;
  if(!confirm('Replace all current data with this backup?'))return;setState(d);persist();if(!S.users.some(u=>u.id===CU.id))CU=null;render();toast('Backup restored')}catch(e){alert('This file is not a valid backup from this version.')}};rd.readAsText(f);inp.value=''}
function resetAll(){if(confirm('Erase everything and reload the demo data?')){S=defaultState();migrate();persist();CU=null;render()}}

const NEW_GL=[
 {code:'1200',title:'Stock Inventory',map:'BS_ASSET',parent:'Current Assets',opening:0,sys:1},
 {code:'4030',title:'Stock Sales to Students',map:'PL_INCOME',parent:'Income',opening:0,sys:1},
 {code:'4040',title:'Library Fine Income',map:'PL_INCOME',parent:'Income',opening:0,sys:1},
 {code:'4045',title:'Library Fee Income',map:'PL_INCOME',parent:'Income',opening:0,sys:1},
 {code:'4050',title:'Admission Fee Income',map:'PL_INCOME',parent:'Income',opening:0,sys:1},
 {code:'4060',title:'Annual Fee Income',map:'PL_INCOME',parent:'Income',opening:0,sys:1},
 {code:'4070',title:'Extra-curricular Activity Fee Income',map:'PL_INCOME',parent:'Income',opening:0,sys:1},
 {code:'5050',title:'Stock Used for School (Expense)',map:'PL_EXPENSE',parent:'Expense',opening:0,sys:1},
 {code:'5060',title:'Cost of Stock Issued to Students',map:'PL_EXPENSE',parent:'Expense',opening:0,sys:1}];
function migrate(){
  NEW_GL.forEach(a=>{if(!glOf(a.code))S.gl.push({...a})});S.gl.sort((a,b)=>a.code.localeCompare(b.code));
  ['charges','routes','books','issues','notices','complaints','work','leaves','schedules','attendance'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
  if(!S.stock)S.stock={items:[],moves:[]};
  S.cfg=Object.assign({blockOnDues:true,dueLimit:0,libFine:5,loanDays:14},S.cfg||{});
  S.cfg.sheet=Object.assign({url:'',token:'',auto:false},S.cfg.sheet||{});
  if(!Array.isArray(S.cfg.approverRoles))S.cfg.approverRoles=['Admin','Principal'];
  if(!Array.isArray(S.cfg.navOrder))S.cfg.navOrder=[];
  if(!S.cfg.branchCode)S.cfg.branchCode='MB';
  if(!S.cfg.computerCode)S.cfg.computerCode='A';
  S.students.forEach(s=>{if(!s.regNo)s.regNo=''});
  S.cfg.whatsapp=Object.assign({schoolNumber:'',
    welcomeTpl:'Dear {parent}, welcome to {school}! {student} has been admitted to {class}. We look forward to a great journey together.',
    birthdayTpl:'Dear {parent}, wishing {student} a very Happy Birthday from all of us at {school}.',
    billTpl:'Dear {parent}, this is a reminder that {student} ({class}) has a fee due of {due} at {school}. Kindly clear it at your convenience. Thank you.'},S.cfg.whatsapp||{});
  if(!Array.isArray(S.groups))S.groups=[];
  if(!Array.isArray(S.waLog))S.waLog=[];
  if(!Array.isArray(S.closings))S.closings=[];
  if(!S.gl.some(a=>a.code==='3020'))S.gl.push({code:'3020',title:'Revaluation Reserve',map:'BS_EQUITY',parent:'Reserves',opening:0,sys:1});
  if(!Array.isArray(S.leaveTypes)||!S.leaveTypes.length)S.leaveTypes=['Casual Leave','Sick Leave','Home / Annual Leave','Unpaid Leave','Maternity / Paternity Leave','Other'];
  if(!Array.isArray(S.examTerms)||!S.examTerms.length)S.examTerms=['1st Terminal','2nd Terminal','3rd Terminal','4th Terminal','1st Assessment','2nd Assessment','3rd Assessment','4th Assessment'];
  if(S.examTerms.includes('1st Terminal')&&!S.examTerms.includes('1st Terminal Exam')){
    S.results.forEach(r=>{if(r.term==='1st Terminal Exam')r.term='1st Terminal'});
    (S.schedules||[]).forEach(x=>{if(x.term==='1st Terminal Exam')x.term='1st Terminal'});
  }
  if(!S.leaveQuota||typeof S.leaveQuota!=='object')S.leaveQuota={};
  S.leaveTypes.forEach(t=>{if(S.leaveQuota[t]===undefined)S.leaveQuota[t]=0});
  if(!Array.isArray(S.leaveAllocOverrides))S.leaveAllocOverrides=[];
  if(!Array.isArray(S.staffLeaves))S.staffLeaves=[];
  S.staffLeaves.forEach(l=>{if(!Array.isArray(l.history))l.history=[];if(l.days===undefined)l.days=daysBetween(l.from,l.to)+1});
  S.staffAtt=Object.assign({lat:'',lng:'',radius:25,workStart:'09:00',workEnd:'16:00',graceMin:10,earlyMin:15,geoEnabled:true},S.staffAtt||{});
  if(!Array.isArray(S.staffAttendance))S.staffAttendance=[];
  if(!S.seatConfig||typeof S.seatConfig!=='object')S.seatConfig={};
  if(!Array.isArray(S.feeInvoices))S.feeInvoices=[];
  S.feeInvoices.forEach(i=>{if(!Array.isArray(i.payments))i.payments=[];if(i.paid===undefined)i.paid=0});
  S.classes.forEach(c=>{if(c.substituteId===undefined)c.substituteId='';c.subjects.forEach(s=>{if(!s.ch)s.ch=4})});
  S.cfg.resultPub=Object.assign({v1:true,v2:true,published:'v1'},S.cfg.resultPub||{});
  if(!S.cfg.resultPub.v1&&!S.cfg.resultPub.v2)S.cfg.resultPub.v1=true;
  if(S.cfg.resultPub.published==='v2'&&!S.cfg.resultPub.v2)S.cfg.resultPub.published='v1';
  if(S.cfg.resultPub.published==='v1'&&!S.cfg.resultPub.v1)S.cfg.resultPub.published='v2';
  if(S.inst.district===undefined)S.inst.district='';
  if(S.inst.province===undefined)S.inst.province='';
  if(S.inst.issueDateBs===undefined)S.inst.issueDateBs='';
  S.students.forEach(s=>{if(s.nameNp===undefined)s.nameNp='';if(s.dobBs===undefined)s.dobBs='';if(s.symbolNo===undefined)s.symbolNo=''});
  if(S.inst.principalSign===undefined)S.inst.principalSign='';
  S.employees.forEach(e=>{if(e.sign===undefined)e.sign=''});
  S.students.forEach(s=>{if(!Array.isArray(s.history))s.history=[];
    s.history=s.history.map(mv=>({id:mv.id||uid('MV'),date:mv.date||today(),type:mv.type||'Promotion',method:mv.method||'Manual',
      fromClassId:mv.fromClassId!==undefined?mv.fromClassId:(mv.from||''),toClassId:mv.toClassId!==undefined?mv.toClassId:(mv.to||''),
      fromFee:mv.fromFee!==undefined?mv.fromFee:s.fee,fromStatus:mv.fromStatus||'Active',note:mv.note||'',by:mv.by||'',reverted:!!mv.reverted,revertedBy:mv.revertedBy||'',revertedDate:mv.revertedDate||''}))});
  S.receipts.forEach(r=>{r.heads=Object.assign({tuition:0,exam:0,transport:0,other:0,admission:0,annual:0,activity:0,library:0},r.heads||{})});
}
function setState(d){S=Object.assign(defaultState(),d);migrate()}

const isAdm=()=>CU&&['Admin','Principal'].includes(CU.role);
const myCids=()=>CU.role==='Teacher'?S.classes.filter(c=>c.teacherId===CU.linkId||(c.substituteId===CU.linkId&&teacherOnLeave(c.teacherId))).map(c=>c.id):S.classes.map(c=>c.id);
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};

const routeOf=id=>S.routes.find(r=>r.id===id);
const itemOf=id=>S.stock.items.find(x=>x.id===id);

/* ---------------- stock engine ---------------- */
const qtyOf=(id,list)=>r2((list||S.stock.moves).filter(m=>m.itemId===id).reduce((s,m)=>s+(m.type==='IN'?m.qty:-m.qty),0));
function avgOf(id){const ins=S.stock.moves.filter(m=>m.itemId===id&&m.type==='IN'),q=ins.reduce((s,m)=>s+m.qty,0);return q?r2(ins.reduce((s,m)=>s+m.amount,0)/q):0}
function applyLibFine(i){
  S.vouchers=S.vouchers.filter(v=>!(v.ref&&v.ref.fineOf===i.id));S.charges=S.charges.filter(c=>!(c.src==='LIB'&&c.ref===i.id));
  if(i.fine>0&&i.memberType==='Student'){const st=stuOf(i.memberId),b=S.books.find(x=>x.id===i.bookId);
    const v=postVoucher({date:i.returnDate,type:'LIB',ref:{fineOf:i.id},narration:`Library fine: ${(b||{}).title} (${st?st.name:''})`,lines:[{code:'1070',dr:i.fine},{code:'4040',cr:i.fine}]});
    S.charges.push({id:uid('CHG'),date:i.returnDate,studentId:i.memberId,desc:`Library fine: ${(b||{}).title}`,amount:i.fine,src:'LIB',ref:i.id,voucherId:v.id})}
}
Object.assign(APPLY,{
  SAVE_ITEM(p){const it=p.item;if(it.id){const i=S.stock.items.findIndex(x=>x.id===it.id);if(i<0)throw new Error('Item not found');S.stock.items[i]={...S.stock.items[i],...it}}
    else{if(S.stock.items.some(x=>x.name.toLowerCase()===it.name.toLowerCase()))throw new Error('An item with this name already exists');it.id=nextSeq('itm','ITM');S.stock.items.push(it)}},
  DEL_ITEM(p){if(S.stock.moves.some(m=>m.itemId===p.id))throw new Error('Item has stock movements. Delete them first.');S.stock.items=S.stock.items.filter(x=>x.id!==p.id)},
  SAVE_STOCKMOV(p){
    const m=p.mov,it=itemOf(m.itemId);if(!it)throw new Error('Select a stock item');const qty=num(m.qty);if(qty<=0)throw new Error('Quantity must be greater than zero');
    const old=m.id?S.stock.moves.find(x=>x.id===m.id):null;if(m.id&&!old)throw new Error('Entry not found');
    const rec={id:old?old.id:nextSeq('smv','SM'),date:m.date,itemId:it.id,type:m.type,purpose:m.purpose,qty,note:m.note||'',supplier:m.supplier||'',mode:m.mode||'',studentId:'',voucherId:old?old.voucherId:''};
    let lines,narr,charge=null;
    if(m.type==='IN'){const amt=r2(m.amount);if(amt<=0)throw new Error('Amount must be greater than zero');rec.amount=amt;rec.rate=r2(amt/qty);
      lines=[{code:'1200',dr:amt},{code:m.mode==='PAYABLE'?'2040':payGL(m.mode),cr:amt}];narr=`Stock in: ${it.name} ${qty} ${it.unit}${rec.supplier?' from '+rec.supplier:''}`}
    else{const rate=avgOf(it.id),cost=r2(qty*rate);rec.rate=rate;rec.amount=cost;
      if(m.purpose==='SCHOOL'){lines=[{code:'5050',dr:cost},{code:'1200',cr:cost}];narr=`Stock issued for school use: ${it.name} ${qty} ${it.unit}${rec.note?' ('+rec.note+')':''}`}
      else{const st=stuOf(m.studentId);if(!st)throw new Error('Select the student');rec.studentId=st.id;const price=num(m.price)||it.saleRate||rate,bill=r2(qty*price);rec.price=price;rec.bill=bill;
        lines=[{code:'1070',dr:bill},{code:'4030',cr:bill},{code:'5060',dr:cost},{code:'1200',cr:cost}];narr=`Stock issued to student: ${it.name} ${qty} ${it.unit} - ${st.name}`;
        charge={id:uid('CHG'),date:m.date,studentId:st.id,desc:`${it.name} x ${qty} ${it.unit}`,amount:bill,src:'STOCK',ref:rec.id}}}
    const list=S.stock.moves.filter(x=>x.id!==rec.id).concat(rec);
    if(qtyOf(it.id,list)<0||(old&&qtyOf(old.itemId,list)<0))throw new Error('This would make stock negative. Check quantities.');
    if(m.type==='OUT'&&qty>qtyOf(it.id,S.stock.moves.filter(x=>x.id!==rec.id)))throw new Error('Only '+qtyOf(it.id,S.stock.moves.filter(x=>x.id!==rec.id))+' '+it.unit+' available');
    if(old){const v=S.vouchers.find(x=>x.id===old.voucherId);if(v){v.date=m.date;v.narration=narr;v.lines=lines.map(l=>({code:l.code,dr:l.dr||0,cr:l.cr||0}))}
      S.charges=S.charges.filter(c=>!(c.src==='STOCK'&&c.ref===rec.id));S.stock.moves[S.stock.moves.findIndex(x=>x.id===old.id)]=rec}
    else{const v=postVoucher({date:m.date,type:'STK',ref:{moveId:rec.id},narration:narr,lines});rec.voucherId=v.id;S.stock.moves.unshift(rec)}
    if(charge){charge.voucherId=rec.voucherId;S.charges.push(charge)}},
  DEL_STOCKMOV(p){const m=S.stock.moves.find(x=>x.id===p.id);if(!m)throw new Error('Entry not found');
    if(qtyOf(m.itemId,S.stock.moves.filter(x=>x.id!==m.id))<0)throw new Error('Deleting this stock-in would make stock negative');
    S.vouchers=S.vouchers.filter(v=>v.id!==m.voucherId);S.charges=S.charges.filter(c=>!(c.src==='STOCK'&&c.ref===m.id));S.stock.moves=S.stock.moves.filter(x=>x.id!==m.id)},
  SAVE_ROUTE(p){const r=p.route;if(r.id){const i=S.routes.findIndex(x=>x.id===r.id);if(i<0)throw new Error('Route not found');S.routes[i]={...S.routes[i],...r}}else{r.id=nextSeq('rt','RT');S.routes.push(r)}},
  DEL_ROUTE(p){if(S.students.some(s=>s.routeId===p.id))throw new Error('Students are assigned to this route. Unassign them first.');S.routes=S.routes.filter(r=>r.id!==p.id)},
  ASSIGN_ROUTE(p){const s=stuOf(p.studentId);if(!s)throw new Error('Student not found');s.routeId=p.routeId||''},
  SAVE_BOOK(p){const b=p.book;if(b.id){const i=S.books.findIndex(x=>x.id===b.id);if(i<0)throw new Error('Book not found');
      const out=S.issues.filter(x=>x.bookId===b.id&&x.status==='Issued').length;if(b.copies<out)throw new Error(out+' copies are currently issued; copies cannot be fewer');S.books[i]={...S.books[i],...b}}
    else{b.id=nextSeq('bk','BK');S.books.push(b)}},
  DEL_BOOK(p){if(S.issues.some(i=>i.bookId===p.id))throw new Error('This book has issue history. Delete those records first.');S.books=S.books.filter(b=>b.id!==p.id)},
  ISSUE_BOOK(p){const b=S.books.find(x=>x.id===p.bookId);if(!b)throw new Error('Select a book');
    if(b.copies-S.issues.filter(x=>x.bookId===b.id&&x.status==='Issued').length<=0)throw new Error('No copy available');
    const who=p.memberType==='Student'?stuOf(p.memberId):empOf(p.memberId);if(!who)throw new Error('Select the member');
    S.issues.unshift({id:nextSeq('iss','ISS'),bookId:b.id,memberType:p.memberType,memberId:p.memberId,memberName:who.name,issueDate:p.issueDate,dueDate:p.dueDate,returnDate:'',fine:0,status:'Issued'})},
  RETURN_BOOK(p){const i=S.issues.find(x=>x.id===p.id);if(!i||i.status==='Returned')throw new Error('Issue record not found or already returned');
    i.returnDate=p.returnDate;i.fine=Math.max(0,daysBetween(i.dueDate,i.returnDate))*num(S.cfg.libFine);i.status='Returned';applyLibFine(i)},
  SAVE_ISSUE(p){const i=S.issues.find(x=>x.id===p.id);if(!i)throw new Error('Record not found');if(p.dueDate<p.issueDate)throw new Error('Due date is before issue date');
    i.issueDate=p.issueDate;i.dueDate=p.dueDate;if(i.status==='Returned'){if(p.returnDate<p.issueDate)throw new Error('Return date is before issue date');i.returnDate=p.returnDate;i.fine=Math.max(0,daysBetween(i.dueDate,i.returnDate))*num(S.cfg.libFine);applyLibFine(i)}},
  DEL_ISSUE(p){S.vouchers=S.vouchers.filter(v=>!(v.ref&&v.ref.fineOf===p.id));S.charges=S.charges.filter(c=>!(c.src==='LIB'&&c.ref===p.id));S.issues=S.issues.filter(x=>x.id!==p.id)}
});

function saveStudent(e,id){e.preventDefault();const F=new FormData(e.target),f=Object.fromEntries(F.entries());
  const dup=S.students.find(x=>x.classId===f.classId&&x.roll===f.roll.trim()&&x.id!==id&&x.status==='Active');
  if(dup&&!confirm(`Roll ${f.roll} is already used by ${dup.name}. Continue anyway?`))return;
  if(f.nationality==='Other'&&!(f.passportNo||'').trim()){alert('Passport no. is required for a nationality other than Nepal or India.');return}

function saveWork(e,id){const f=fd(e);const w={type:f.type,classId:f.classId,subject:f.subject.trim(),title:f.title.trim(),desc:f.desc.trim(),date:f.date,due:f.due};

/* ---------------- staff / teacher / principal leave ---------------- */
const selfStaffKey=()=>{if(!CU)return'';if(CU.linkId&&empOf(CU.linkId))return'EMP:'+CU.linkId;return'USR:'+CU.id};
function staffDirectory(){
  const list=S.employees.map(e=>({key:'EMP:'+e.id,name:e.name,role:e.role})),covered=new Set(S.employees.map(e=>e.id));
  S.users.filter(u=>['Admin','Principal','Staff','Teacher'].includes(u.role)&&u.active).forEach(u=>{
    if(u.linkId&&covered.has(u.linkId))return;if(list.some(x=>x.key==='USR:'+u.id))return;
    list.push({key:'USR:'+u.id,name:u.name,role:u.role})});
  return list;
}
const staffOfKey=key=>staffDirectory().find(x=>x.key===key);
function teacherOnLeave(empId,d){d=d||today();return!!empId&&S.staffLeaves.some(l=>l.status==='Approved'&&l.subjectKey==='EMP:'+empId&&l.from<=d&&d<=l.to)}
const canDecideStaffLeave=l=>{if(!CU)return false;if(l.subjectRole==='Principal')return CU.role==='Admin'||(CU.role==='Principal'&&l.subjectKey===selfStaffKey());return isAdm()};
const canEditStaffLeave=l=>l.status==='Pending'&&(isAdm()||l.subjectKey===selfStaffKey());
const canDeleteStaffLeave=l=>isAdm()||(l.subjectKey===selfStaffKey()&&l.status==='Pending');
const slBadge=s=>`<span class="badge ${s==='Approved'?'ok':s==='Rejected'?'dan':'warn'}">${s}</span>`;
function slRow(l){
  const canDec=l.status==='Pending'&&canDecideStaffLeave(l),canRev=l.status!=='Pending'&&canDecideStaffLeave(l),canEd=canEditStaffLeave(l),canDel=canDeleteStaffLeave(l);
  return`<tr><td>${l.id}</td><td>${esc(l.subjectName)} <span class="badge">${esc(l.subjectRole)}</span></td><td>${esc(l.type)}</td><td>${l.from}${l.from!==l.to?' to '+l.to:''}</td><td class="num">${l.days}</td><td>${esc(l.reason||'-')}</td><td>${slBadge(l.status)}${l.note?`<div class="mut" style="font-size:10px">${esc(l.note)}</div>`:''}</td>
  <td style="white-space:nowrap">${canDec?`<button class="btn sm ok" onclick="decideStaffLeave('${l.id}','Approved')">Approve</button> <button class="btn sm dan" onclick="decideStaffLeave('${l.id}','Rejected')">Reject</button> `:''}${canEd?`<button class="btn sm" onclick="openStaffLeaveForm('${l.id}')">Edit</button> `:''}${canRev?`<button class="btn sm warn" onclick="revertStaffLeave('${l.id}')">Revert</button> `:''}${canDel?`<button class="btn sm dan" onclick="delStaffLeave('${l.id}')">Delete</button>`:''}</td></tr>`;
}

  UI.slTab=UI.slTab||'mine';const admin=isAdm();

  let body='';

  if(UI.slTab==='mine'){
    const mine=S.staffLeaves.filter(l=>l.subjectKey===selfStaffKey()).sort((a,b)=>b.from.localeCompare(a.from));
    const myKey=selfStaffKey(),yr=(new Date).getFullYear();
    const balRows=myKey?S.leaveTypes.filter(t=>leaveAllocFor(myKey,t)>0).map(t=>{

      return`<tr><td>${esc(t)}</td><td class="num">${alloc}</td><td class="num">${used}</td><td class="num">${rem<0?`<span class="badge dan">${rem}</span>`:rem}</td></tr>`;
    }).join(''):'';

    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>My leave applications</b><button class="btn pri" onclick="openStaffLeaveForm()">Apply for leave</button></div>
    ${tbl(['Ref','Staff','Type','Dates','Days','Reason','Status',''],mine.map(slRow).join(''),'No leave applications yet.')}</div>`;
  }else if(UI.slTab==='pending'){
    const pend=S.staffLeaves.filter(l=>l.status==='Pending').sort((a,b)=>a.from.localeCompare(b.from));
    body=`<div class="card"><b>Requests waiting for a decision</b><p class="mut" style="font-size:11px;margin:4px 0 10px">The Principal's own leave can only be approved by the Principal themself or the Administrator.</p>

  }else if(UI.slTab==='all'){
    const dir=staffDirectory(),list=(UI.slFilter?S.staffLeaves.filter(l=>l.subjectKey===UI.slFilter):S.staffLeaves).slice().sort((a,b)=>b.from.localeCompare(a.from));
    body=`<div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px"><b>Full leave record</b><div style="min-width:220px"><select class="inp" onchange="UI.slFilter=this.value;render()"><option value="">- all staff -</option>${opt(dir,x=>x.key,x=>x.name+' ('+x.role+')',UI.slFilter||'')}</select></div><button class="btn pri" onclick="openStaffLeaveForm()">Log leave</button></div>
    ${tbl(['Ref','Staff','Type','Dates','Days','Reason','Status',''],list.map(slRow).join(''),'No leave records.')}</div>`;
  }else if(UI.slTab==='types'){
    body=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>Leave types</b><button class="btn pri" onclick="addLeaveType()">Add type</button></div>
    ${tbl(['Leave type',''],S.leaveTypes.map((t,i)=>`<tr><td>${esc(t)}</td><td style="white-space:nowrap"><button class="btn sm" onclick="renameLeaveType(${i})">Rename</button> <button class="btn sm dan" onclick="delLeaveType(${i})">Delete</button></td></tr>`).join(''),'No leave types.')}</div>`;
  }else if(UI.slTab==='alloc'){
    const dir=staffDirectory(),yr=(new Date).getFullYear();
    body=`<div class="card"><b>Default annual allocation, per leave type</b><p class="mut" style="font-size:11px;margin:4px 0 10px">Days each staff member gets per year, unless overridden below for a specific person.</p>
     ${tbl(['Leave type','Annual quota (days)',''],S.leaveTypes.map(t=>`<tr><td>${esc(t)}</td><td class="num">${S.leaveQuota[t]||0}</td><td><button class="btn sm" onclick="setLeaveQuota('${esc(t)}')">Set quota</button></td></tr>`).join(''),'No leave types.')}</div>
     <div class="card mt-3"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>Staff-specific overrides</b><button class="btn pri" onclick="openLeaveOverrideForm()">Add override</button></div>
     <p class="mut" style="font-size:11px;margin:0 0 10px">Use this to give a specific staff member a different annual quota than the default above (e.g. extra sick leave).</p>
     ${tbl(['Staff','Type','Annual quota (days)','Note',''],S.leaveAllocOverrides.map(o=>`<tr><td>${esc(o.subjectName)}</td><td>${esc(o.type)}</td><td class="num">${o.days}</td><td>${esc(o.note||'-')}</td><td style="white-space:nowrap"><button class="btn sm" onclick="openLeaveOverrideForm('${o.id}')">Edit</button> <button class="btn sm dan" onclick="delLeaveOverride('${o.id}')">Delete</button></td></tr>`).join(''),'No overrides set - everyone uses the default quota.')}</div>
     <div class="card mt-3"><b>Leave balance - ${yr}</b><p class="mut" style="font-size:11px;margin:4px 0 10px">Approved leave days used so far this year, against each staff member's allocation.</p>
     ${tbl(['Staff','Role','Type','Allocated','Used','Remaining'],dir.flatMap(x=>S.leaveTypes.filter(t=>leaveAllocFor(x.key,t)>0).map(t=>{
        const alloc=leaveAllocFor(x.key,t),used=leaveUsedDays(x.key,t,yr),rem=alloc-used;
        return`<tr><td>${esc(x.name)}</td><td>${esc(x.role)}</td><td>${esc(t)}</td><td class="num">${alloc}</td><td class="num">${used}</td><td class="num">${rem<0?`<span class="badge dan">${rem}</span>`:rem}</td></tr>`;
     })).join(''),'No allocations set up yet.')}</div>`;
  }
  return tabHtml+body;
};
function openStaffLeaveForm(id){
  const l=id?S.staffLeaves.find(x=>x.id===id):null;
  if(l&&!canEditStaffLeave(l)){alert('This leave record can no longer be edited.');return}
  const dir=staffDirectory(),selfKey=selfStaffKey();
  if(!isAdm()&&!staffOfKey(selfKey)){alert('Your login is not linked to a staff profile. Ask the Administrator to link it under User credentials.');return}
  openModal(id?'Edit leave application':'Apply for leave',`<form onsubmit="saveStaffLeave(event,'${id||''}')" class="grid grid-cols-2 gap-3">
   ${isAdm()?fld('Staff member *',`<select class="inp" name="subjectKey">${opt(dir,x=>x.key,x=>x.name+' ('+x.role+')',l?l.subjectKey:selfKey)}</select>`,'col-span-2'):`<input type="hidden" name="subjectKey" value="${esc(selfKey)}">`}
   ${fld('Leave type *',`<select class="inp" name="type">${opt(S.leaveTypes,x=>x,x=>x,l?l.type:S.leaveTypes[0])}</select>`)}
   ${fld('From *',`<input class="inp" type="date" name="from" required value="${l?l.from:today()}">`)}
   ${fld('To *',`<input class="inp" type="date" name="to" required value="${l?l.to:today()}">`)}
   ${fld('Reason',`<textarea class="inp" name="reason">${esc(l?(l.reason||''):'')}</textarea>`,'col-span-2')}
   <div class="col-span-2" style="text-align:right">${closeBtn()} <button class="btn pri">Save</button></div></form>`);
}
function saveStaffLeave(e,id){
  const f=fd(e);if(f.to<f.from){alert('End date is before start date.');return}
  const subj=staffOfKey(f.subjectKey);if(!subj){alert('Select a valid staff member.');return}
  const days=daysBetween(f.from,f.to)+1;
  let ok;
  if(id){
    const l=S.staffLeaves.find(x=>x.id===id);if(!l){alert('Leave record not found');return}
    if(!canEditStaffLeave(l)){alert('This leave record can no longer be edited.');return}
    const rec={subjectKey:f.subjectKey,subjectName:subj.name,subjectRole:subj.role,type:f.type,from:f.from,to:f.to,days,reason:(f.reason||'').trim()};
    ok=dispatch('SAVE_STAFFLEAVE',{id,rec,hist:{date:today(),by:CU.name,action:'Edited'}},'Edit leave application '+id,'STAFFLEAVE');
  }else{
    const rec={id:uid('SL'),subjectKey:f.subjectKey,subjectName:subj.name,subjectRole:subj.role,type:f.type,from:f.from,to:f.to,days,reason:(f.reason||'').trim(),status:'Pending',appliedBy:CU.name,note:'',history:[{date:today(),by:CU.name,action:'Applied'}]};
    ok=dispatch('SAVE_STAFFLEAVE',{rec},'Leave request: '+subj.name+' ('+f.from+' to '+f.to+')','STAFFLEAVE');
  }

function haversine(lat1,lng1,lat2,lng2){
  const R=6371000,toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

function hmToMin(t){if(!t)return null;const p=t.split(':');return(+p[0])*60+(+p[1])}

/* ---------------- biometric device login (WebAuthn, per-device convenience) ---------------- */
const BIO_KEY='TOPPERS_BIO_CRED';
const bioSupported=()=>!!(window.isSecureContext&&window.PublicKeyCredential&&navigator.credentials);
function bioUnavailableReason(){
  if(!window.isSecureContext)return'Biometric login needs a secure (https://) connection with a valid certificate. This page is being loaded over http://, a plain file, or a site with a certificate problem, so the browser blocks it. Open the app via its https:// address (e.g. the Apps Script /exec URL) to use this feature.';
  if(!window.PublicKeyCredential||!navigator.credentials)return'Biometric login is not supported in this browser.';
  return'Biometric login is not available right now.';
}
const bufToB64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64ToBuf=b64=>Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
function bioStored(){try{return JSON.parse(localStorage.getItem(BIO_KEY)||'null')}catch(e){return null}}
async function enableBiometric(){
  if(!bioSupported()){alert(bioUnavailableReason());return}
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:S.inst.name||'School ERP'},
      user:{id:new TextEncoder().encode(CU.id),name:CU.username,displayName:CU.name},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
      timeout:60000}});
    if(!cred)throw new Error('No credential created');
    localStorage.setItem(BIO_KEY,JSON.stringify({credId:bufToB64(cred.rawId),userId:CU.id,role:CU.role}));
    toast('Biometric login enabled on this device');render();
  }catch(e){alert('Could not enable biometric login: '+e.message)}
}
function disableBiometric(){localStorage.removeItem(BIO_KEY);toast('Biometric login disabled on this device');render()}
async function bioLogin(){
  const st=bioStored();if(!st){alert('No biometric login has been set up on this device yet. Sign in with your password first, then enable it under Staff attendance.');return}
  try{
    const assertion=await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{id:b64ToBuf(st.credId),type:'public-key'}],
      userVerification:'required',timeout:60000}});
    if(!assertion)throw new Error('Verification failed');
    const u=S.users.find(x=>x.id===st.userId);
    if(!u||!u.active){alert('This account is no longer available on this device. Use username & password.');return}
    CU=u;try{sessionStorage.setItem(SS_KEY,u.id)}catch(x){}
    cur=HOME[u.role];UI.kid='';render();
  }catch(e){alert('Biometric verification failed or was cancelled.')}
}

const GS_SCRIPT=`// TOPPERS ERP - Google Sheets store (Apps Script)
// 1) Create a Google Sheet > Extensions > Apps Script > paste this > set TOKEN
// 2) Deploy > New deployment > Web app > Execute as: Me, Access: Anyone > copy the URL
const TOKEN = 'CHANGE_ME_TO_A_SECRET';
function out_(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON)}
function doPost(e){
  const b = JSON.parse(e.postData.contents);
  if (b.token !== TOKEN) return out_({ok:false,error:'Wrong token'});
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  if (b.action === 'push') {
    const sh = ss.getSheetByName('ERP_DATA') || ss.insertSheet('ERP_DATA');
    sh.clear();
    const s = JSON.stringify(b.data), rows = [];
    for (let i = 0; i < s.length; i += 45000) rows.push([s.substr(i, 45000)]);
    sh.getRange(1, 1, rows.length, 1).setValues(rows);
    sh.getRange(1, 2).setValue('Last saved: ' + new Date());
    Object.keys(b.summary || {}).forEach(function(n){
      const t = ss.getSheetByName(n) || ss.insertSheet(n); t.clear();
      const v = b.summary[n]; if (v.length) t.getRange(1, 1, v.length, v[0].length).setValues(v);
    });
    return out_({ok:true});
  }
  return out_({ok:false,error:'Unknown action'});
}
function doGet(e){
  if (e.parameter.token !== TOKEN) return out_({ok:false,error:'Wrong token'});
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('ERP_DATA');
  if (!sh) return out_({ok:false,error:'No data saved yet'});
  const vals = sh.getRange(1, 1, sh.getLastRow(), 1).getValues().map(function(r){return r[0]}).join('');
  return out_({ok:true,data:JSON.parse(vals)});
}`;

function saveGroup(e,id){e.preventDefault();const F=new FormData(e.target);const mods=F.getAll('mod');

  if(!rec.name){alert('Enter a name.');return}
  if(id){const g=(S.groups||[]).find(x=>x.id===id);Object.assign(g,rec)}else{S.groups=S.groups||[];S.groups.push({id:uid('GRP'),...rec})}
  persist();closeModal();render();toast('Group saved')}
function delGroup(id){if(S.users.some(u=>u.groupId===id)){alert('Unassign users from this group first.');return}

/* ---- WhatsApp messaging (welcome, birthday, fee bill) ---- */
const waPhone=p=>(p||'').replace(/[^\d]/g,'');
const waFill=(tpl,vars)=>String(tpl||'').replace(/\{(\w+)\}/g,(m,k)=>vars[k]!==undefined&&vars[k]!==null?vars[k]:m);
function waVars(s,extra){return Object.assign({parent:s.parentName||'Parent',student:s.name,school:S.inst.name,class:clsName(s.classId),due:npr(duesOf(s.id))},extra||{})}
function waSend(type,s){if(!s)return;const W=S.cfg.whatsapp||{};
  const tpl=type==='welcome'?W.welcomeTpl:type==='birthday'?W.birthdayTpl:W.billTpl;
  const msg=waFill(tpl,waVars(s));const phone=waPhone(s.phone||s.parentPhone);
  if(!phone){alert('No parent phone number on file for '+s.name+'.');return}
  window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');
  S.waLog=S.waLog||[];S.waLog.unshift({id:uid('WA'),date:today(),time:new Date().toLocaleTimeString(),type,studentId:s.id,studentName:s.name,phone,message:msg});
  persist();render();toast('WhatsApp message opened for '+s.name)}

function waBill(id){waSend('bill',stuOf(id))}
function waBirthday(id){waSend('birthday',stuOf(id))}

  openModal('WhatsApp: '+esc(s.name),`<div style="display:flex;flex-direction:column;gap:8px">

function waCustom(id){const s=stuOf(id);if(!s)return;const msg=prompt('Message to send to '+s.parentName+':','');if(!msg)return;

NAV.push({id:'sstmt',l:'Student statement',ic:'\u00a7',g:'Accounts',r:['Admin','Principal','Staff']});
UI.sstmt={studentId:'',from:'',to:today(),mode:'consolidated'};
function studentLedgerRows(sid,from,to){
  const rows=[];
  S.receipts.filter(r=>r.studentId===sid).forEach(r=>{const h=r.heads||{};
    if(num(h.tuition))rows.push({date:r.date,desc:'Tuition fee - receipt '+r.id,type:'Tuition',dr:num(h.tuition),cr:0});
    if(num(h.exam))rows.push({date:r.date,desc:'Exam fee - receipt '+r.id,type:'Exam',dr:num(h.exam),cr:0});
    if(num(h.transport))rows.push({date:r.date,desc:'Vehicle / transport fee - receipt '+r.id,type:'Vehicle',dr:num(h.transport),cr:0});
    if(num(h.other))rows.push({date:r.date,desc:'Other fee - receipt '+r.id,type:'Other fee',dr:num(h.other),cr:0});
    if(num(r.discount))rows.push({date:r.date,desc:'Discount - receipt '+r.id,type:'Discount',dr:0,cr:num(r.discount)});
    if(num(r.paid))rows.push({date:r.date,desc:'Payment received ('+r.mode+') - receipt '+r.id,type:'Payment',dr:0,cr:num(r.paid)});
  });
  (S.charges||[]).filter(c=>c.studentId===sid).forEach(c=>{const type=c.src==='STOCK'?'Stock sold':c.src==='LIB'?'Library fine':'Other charge';rows.push({date:c.date,desc:c.desc,type,dr:c.amount,cr:0})});
  let f=rows;if(from)f=f.filter(r=>r.date>=from);if(to)f=f.filter(r=>r.date<=to);
  return f.sort((a,b)=>a.date.localeCompare(b.date));
}
function dateBefore(d){const dt=new Date(d+'T00:00:00');dt.setDate(dt.getDate()-1);return dt.toISOString().slice(0,10)}
function openingBalanceBefore(sid,from){if(!from)return 0;return studentLedgerRows(sid,'',dateBefore(from)).reduce((s,r)=>s+r.dr-r.cr,0)}
VIEWS.sstmt=()=>{
  const U=UI.sstmt,s=U.studentId?stuOf(U.studentId):null;
  const picker=`<div class="card" style="margin-bottom:12px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
   <div style="min-width:220px"><label class="lbl">Student</label><select class="inp" onchange="UI.sstmt.studentId=this.value;render()"><option value="">- select student -</option>${opt(S.students,x=>x.id,x=>x.name+' - '+clsName(x.classId),U.studentId)}</select></div>
   <div><label class="lbl">From</label><input class="inp" type="date" value="${U.from}" onchange="UI.sstmt.from=this.value;render()"></div>
   <div><label class="lbl">To</label><input class="inp" type="date" value="${U.to}" onchange="UI.sstmt.to=this.value;render()"></div>
   <div><label class="lbl">View</label><select class="inp" onchange="UI.sstmt.mode=this.value;render()"><option value="consolidated" ${U.mode==='consolidated'?'selected':''}>Consolidated statement</option><option value="particulars" ${U.mode==='particulars'?'selected':''}>By particulars (fee type)</option></select></div>
   ${s?`<button class="btn pri" onclick="showDoc('Student statement',$('#stmtBody2').innerHTML)">Print</button>`:''}
   </div></div>`;
  if(!s)return picker+`<div class="card"><p class="mut">Select a student to view a fee, vehicle, stock and other-charges statement for any date range.</p></div>`;
  const rows=studentLedgerRows(s.id,U.from,U.to);
  const head=`<b>${esc(s.name)}</b> - ${clsName(s.classId)} - Roll ${esc(s.roll)} <span class="mut">(${esc(s.regNo||s.id)})</span><div class="mut" style="font-size:11px;margin:2px 0 8px">${U.from||'Beginning'} to ${U.to}</div>`;
  let body;
  if(U.mode==='consolidated'){
    let run=openingBalanceBefore(s.id,U.from);
    const openRow=U.from?`<tr><td colspan="5"><b>Opening balance</b></td><td class="num"><b>${npr(run)}</b></td></tr>`:'';
    const midRows=rows.map(r=>{run+=r.dr-r.cr;return`<tr><td>${r.date}</td><td>${esc(r.desc)}</td><td><span class="badge">${r.type}</span></td><td class="num">${r.dr?npr(r.dr):''}</td><td class="num">${r.cr?npr(r.cr):''}</td><td class="num">${npr(run)}</td></tr>`}).join('');
    body=`<div class="card">${head}${tbl(['Date','Particulars','Type','Debit','Credit','Balance'],openRow+midRows+`<tr><td colspan="5"><b>Closing balance</b></td><td class="num"><b>${npr(run)}</b></td></tr>`,'No transactions in this period.')}</div>`;
  }else{
    const groups={};rows.forEach(r=>{(groups[r.type]=groups[r.type]||{dr:0,cr:0,rows:[]}).rows.push(r);groups[r.type].dr+=r.dr;groups[r.type].cr+=r.cr});
    const keys=Object.keys(groups);
    body=`<div class="card">${head}
    ${keys.length?`<div class="grid gap-3">${keys.map(t=>{const g=groups[t];return`<div class="card" style="background:var(--panel2)"><b>${esc(t)}</b>${tbl(['Date','Particulars','Billed','Paid / adjusted'],g.rows.map(r=>`<tr><td>${r.date}</td><td>${esc(r.desc)}</td><td class="num">${r.dr?npr(r.dr):''}</td><td class="num">${r.cr?npr(r.cr):''}</td></tr>`).join('')+`<tr><td colspan="2"><b>Subtotal</b></td><td class="num"><b>${npr(g.dr)}</b></td><td class="num"><b>${npr(g.cr)}</b></td></tr>`)}</div>`}).join('')}</div>
    <div style="margin-top:10px">${tbl(['Particulars type','Total billed','Total received / adjusted','Net'],keys.map(t=>{const g=groups[t];return`<tr><td>${esc(t)}</td><td class="num">${npr(g.dr)}</td><td class="num">${npr(g.cr)}</td><td class="num">${npr(g.dr-g.cr)}</td></tr>`}).join(''))}</div>`:'<p class="mut">No transactions in this period.</p>'}</div>`;
  }
  return picker+`<div id="stmtBody2">${body}</div>`;
};

/* ---- system audit trail: who did what, and when ---- */
function auditLog(action,detail){S.audit=S.audit||[];S.audit.unshift({id:uid('AUD'),date:today(),time:new Date().toLocaleTimeString(),user:CU?CU.name:'-',role:CU?CU.role:'-',action,detail});if(S.audit.length>2000)S.audit.length=2000}
const _dispatch=dispatch;
dispatch=function(action,payload,summary,module){const r=_dispatch(action,payload,summary,module);if(r)auditLog(isChk()?'Posted directly':'Sent for approval',`[${module}] ${summary}`);return r};
const _approve=approve;approve=function(id){const it=S.stack.find(x=>x.id===id);const before=it&&it.status;_approve(id);if(it&&it.status!==before)auditLog('Approved','['+it.module+'] '+it.summary+' (ref '+id+')')};
const _reject=reject;reject=function(id){const it=S.stack.find(x=>x.id===id);const before=it&&it.status;_reject(id);if(it&&it.status!==before)auditLog('Rejected','['+it.module+'] '+it.summary+' (ref '+id+')')};
NAV.push({id:'audit',l:'Audit trail',ic:'\u2318',g:'Administration',r:['Admin','Principal']});
UI.aud={from:'',to:'',q:''};
VIEWS.audit=()=>{const U=UI.aud;let a=S.audit||[];if(U.from)a=a.filter(x=>x.date>=U.from);if(U.to)a=a.filter(x=>x.date<=U.to);if(U.q)a=a.filter(x=>(x.user+x.action+x.detail).toLowerCase().includes(U.q.toLowerCase()));
  return`<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px">
  <div><label class="lbl">From</label><input class="inp" type="date" value="${U.from}" onchange="UI.aud.from=this.value;render()"></div>
  <div><label class="lbl">To</label><input class="inp" type="date" value="${U.to}" onchange="UI.aud.to=this.value;render()"></div>
  <div style="flex:1;min-width:180px"><label class="lbl">Search</label><input class="inp" value="${esc(U.q)}" placeholder="User or keyword" onchange="UI.aud.q=this.value;render()"></div></div>
  <p class="mut" style="font-size:11px;margin:0 0 10px">Every entry saved, sent for approval, approved or rejected is recorded here with the user, role, date and time. This log cannot be edited from within the app.</p>
  ${tbl(['Date','Time','User','Role','Action','Detail'],a.slice(0,500).map(x=>`<tr><td>${x.date}</td><td>${esc(x.time||'')}</td><td>${esc(x.user)}</td><td><span class="badge">${esc(x.role)}</span></td><td>${esc(x.action)}</td><td>${esc(x.detail)}</td></tr>`).join(''),'No activity recorded yet.')}</div>`};

/* =========================================================================
   EXTENSIONS 4: student leaving (TC/CC/NOC), fixed asset reports & revaluation,
   fiscal year-end closing

/* ---- student leaving / dropping, with auto-generated documents ---- */
function openDropForm(id){const s=stuOf(id);if(!s)return;const dues=duesOf(id);
  openModal('Student leaving (\u0938\u094d\u0915\u0941\u0932 \u091b\u094b\u0921\u094d\u0928\u0941): '+esc(s.name),`<form onsubmit="saveDrop(event,'${id}')" class="grid grid-cols-2 gap-3">
   ${fld('Date of leaving *',`<input class="inp" type="date" name="leaveDate" required value="${today()}">`)}
   ${fld('New status *',`<select class="inp" name="status">${opt(['Left','Transferred','Graduated'],x=>x,x=>x,'Left')}</select>`)}
   ${fld('Reason for leaving',`<input class="inp" name="reason" placeholder="e.g. family relocation">`,'col-span-2')}
   ${fld('Conduct / character remark',`<select class="inp" name="conduct">${opt(['Excellent','Very Good','Good','Satisfactory'],x=>x,x=>x,'Good')}</select>`)}
   <p class="col-span-2 ${dues>0?'neg':'pos'}" style="font-weight:700;margin:0">${dues>0?'Outstanding dues of '+npr(dues)+' remain. Settle these in Fee collection; you can still record the leaving date now.':'No outstanding dues - final settlement is clear.'}</p>
   <div class="col-span-2" style="text-align:right">${closeBtn()} <button class="btn warn">${isChk()?'Confirm leaving':'Send for approval'}</button></div></form>`);
}
function saveDrop(e,id){e.preventDefault();const f=fd(e);const dues=duesOf(id);
  if(dues>0&&!confirm('Outstanding dues of '+npr(dues)+' remain. Record the leaving date anyway?'))return;
  if(dispatch('DROP_STUDENT',{id,leaveDate:f.leaveDate,status:f.status,reason:(f.reason||'').trim(),conduct:f.conduct},`Drop student ${(stuOf(id)||{}).name} (${f.status})`,'STUDENTS'))closeModal()}
function leavingDocsHTML(sid,type){
  const s=stuOf(sid);if(!s)return'<p>Student not found.</p>';const cls=clsName(s.classId),he=s.gender==='Female'?'daughter':'son';
  const foot=`<div style="display:flex;justify-content:space-between;margin-top:70px;font-size:12px" class="doc-face"><div>Date of issue: ${today()}</div><div>Principal's signature &amp; seal</div></div>`;
  if(type==='TC')return docHead('Transfer Certificate')+`<div class="doc-face" style="font-size:13px;line-height:2">
   <p>This is to certify that <b>${esc(s.name)}</b>, ${he} of <b>${esc(s.parentName)}</b> and <b>${esc(s.motherName||'-')}</b>, Registration No. <b>${esc(s.regNo||s.id)}</b>, Date of birth <b>${s.dob||'-'}</b>, was a bona fide student of this institution, most recently enrolled in <b>${cls}</b>.</p>
   <p>The student has left this school on <b>${s.leaveDate||today()}</b>${s.leaveReason?', for the following reason: <b>'+esc(s.leaveReason)+'</b>':''}. Conduct during the period of study is recorded as <b>${s.conduct||'Good'}</b>.</p>
   <p>All dues to the institution stand settled as of the date of issue of this certificate.</p>
   <p>This Transfer Certificate is issued upon request, for the purpose of admission to another institution.</p></div>${foot}`;
  if(type==='CC')return docHead('Character Certificate')+`<div class="doc-face" style="font-size:13px;line-height:2">
   <p>This is to certify that <b>${esc(s.name)}</b>, ${he} of <b>${esc(s.parentName)}</b>, Registration No. <b>${esc(s.regNo||s.id)}</b>, a student of <b>${cls}</b> at this institution, has, to the best of our knowledge, borne a moral character and conduct recorded as <b>${s.conduct||'Good'}</b> throughout the period of study.</p>
   <p>We wish ${s.gender==='Female'?'her':'him'} every success in ${s.gender==='Female'?'her':'his'} future endeavours.</p></div>${foot}`;
  return docHead('No Objection Letter')+`<div class="doc-face" style="font-size:13px;line-height:2">
   <p>This is to certify that this institution has <b>no objection</b> to <b>${esc(s.name)}</b>, ${he} of <b>${esc(s.parentName)}</b>, Registration No. <b>${esc(s.regNo||s.id)}</b>, formerly a student of <b>${cls}</b>, seeking admission to any other educational institution of ${s.gender==='Female'?'her':'his'} choice.</p>
   <p>All academic and financial matters concerning this student stand settled as of this date.</p></div>${foot}`;
}

/* ---- fixed asset reports and revaluation (appreciation) ---- */
function assetDepAsOf(a,asOf){return r2(S.vouchers.filter(v=>v.ref&&v.ref.assetId===a.id&&v.ref.kind==='DEP'&&(!asOf||v.date<=asOf)).reduce((s,v)=>s+v.lines.filter(l=>l.code==='1510').reduce((t,l)=>t+(l.cr||0)-(l.dr||0),0),0))}
function assetCostAsOf(a,asOf){let c=0;S.vouchers.filter(v=>v.ref&&v.ref.assetId===a.id&&(v.ref.kind==='BUY'||v.ref.kind==='REVAL')&&(!asOf||v.date<=asOf)).forEach(v=>v.lines.filter(l=>l.code==='1500').forEach(l=>c+=(l.dr||0)-(l.cr||0)));return r2(c)}
function assetNBVAsOf(a,asOf){return r2(assetCostAsOf(a,asOf)-assetDepAsOf(a,asOf))}
function openRevalueForm(id){const a=S.assets.find(x=>x.id===id);if(!a)return;
  openModal('Revalue asset: '+esc(a.name),`<form onsubmit="saveRevalue(event,'${id}')" class="grid grid-cols-2 gap-3">
   <p class="mut col-span-2" style="margin:0;font-size:12px">Records an upward revaluation (appreciation). This increases the asset's book cost and credits the Revaluation Reserve (equity) - it does not reduce accumulated depreciation.</p>
   ${fld('Date *',`<input class="inp" type="date" name="date" required value="${today()}">`,'col-span-2')}
   ${fld('Increase in value (NPR) *',`<input class="inp" type="number" name="amount" required min="0.01" step="0.01">`,'col-span-2')}
   ${fld('Note',`<input class="inp" name="note" placeholder="e.g. market valuation report">`,'col-span-2')}
   <div class="col-span-2" style="text-align:right">${closeBtn()} <button class="btn warn">${isChk()?'Post revaluation':'Send for approval'}</button></div></form>`);
}
function saveRevalue(e,id){e.preventDefault();const f=fd(e);
  if(dispatch('REVALUE_ASSET',{id,date:f.date,amount:f.amount,note:(f.note||'').trim()},`Revalue asset ${(S.assets.find(x=>x.id===id)||{}).name} (+${npr(f.amount)})`,'ASSETS'))closeModal()}
NAV.push({id:'assetrpt',l:'Asset reports',ic:'\u25a6',g:'Treasury & assets',r:['Admin','Principal','Staff']});
UI.arpt={from:'',to:today(),tab:'purchase'};
VIEWS.assetrpt=()=>{const U=UI.arpt;
  const tabsHtml=`<div class="tabs">${[['purchase','Purchases'],['dep','Depreciation'],['book','Book value (open/close)'],['appr','Appreciation']].map(t=>`<button class="${U.tab===t[0]?'act':''}" onclick="UI.arpt.tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`;
  const range=`<div class="card" style="margin-bottom:10px"><div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
   <div><label class="lbl">From</label><input class="inp" type="date" value="${U.from}" onchange="UI.arpt.from=this.value;render()"></div>
   <div><label class="lbl">To</label><input class="inp" type="date" value="${U.to}" onchange="UI.arpt.to=this.value;render()"></div>
   <button class="btn pri" onclick="showDoc('Asset report',$('#arptBody').innerHTML)">Print</button></div></div>`;
  let body='';
  if(U.tab==='purchase'){
    const buys=S.vouchers.filter(v=>v.type==='FA'&&v.ref&&v.ref.kind==='BUY'&&(!U.from||v.date>=U.from)&&(!U.to||v.date<=U.to));
    const amtOf=v=>v.lines.filter(l=>l.code==='1500').reduce((s,l)=>s+(l.dr||0),0);
    const rows=buys.map(v=>{const a=S.assets.find(x=>x.id===v.ref.assetId)||{};return`<tr><td>${v.date}</td><td>${esc(a.name||v.ref.assetId)}</td><td>${esc(a.fund||'')}</td><td class="num">${npr(amtOf(v))}</td></tr>`}).join('');
    body=`<div class="card"><b>Fixed asset purchases</b><div class="mut" style="font-size:11px;margin-bottom:8px">${U.from||'Beginning'} to ${U.to}</div>${tbl(['Date','Asset','Funded by','Cost'],rows+`<tr><td colspan="3"><b>Total</b></td><td class="num"><b>${npr(buys.reduce((s,v)=>s+amtOf(v),0))}</b></td></tr>`,'No purchases in this period.')}</div>`;
  }else if(U.tab==='dep'){
    const deps=S.vouchers.filter(v=>v.type==='FA'&&v.ref&&v.ref.kind==='DEP'&&(!U.from||v.date>=U.from)&&(!U.to||v.date<=U.to));
    const amtOf=v=>v.lines.filter(l=>l.code==='1510').reduce((s,l)=>s+(l.cr||0),0);
    const rows=deps.map(v=>{const a=S.assets.find(x=>x.id===v.ref.assetId)||{};return`<tr><td>${v.date}</td><td>${esc(a.name||v.ref.assetId)}</td><td>${esc(v.ref.fy||'')}</td><td class="num">${npr(amtOf(v))}</td></tr>`}).join('');
    body=`<div class="card"><b>Depreciation report</b><div class="mut" style="font-size:11px;margin-bottom:8px">${U.from||'Beginning'} to ${U.to}</div>${tbl(['Date','Asset','Fiscal year','Depreciation'],rows+`<tr><td colspan="3"><b>Total</b></td><td class="num"><b>${npr(deps.reduce((s,v)=>s+amtOf(v),0))}</b></td></tr>`,'No depreciation posted in this period.')}</div>`;
  }else if(U.tab==='book'){
    const openAt=U.from?dateBefore(U.from):null;
    const rows=S.assets.map(a=>{const ob=assetNBVAsOf(a,openAt),cb=assetNBVAsOf(a,U.to||null);
      const add=S.vouchers.filter(v=>v.ref&&v.ref.assetId===a.id&&(v.ref.kind==='BUY'||v.ref.kind==='REVAL')&&(!U.from||v.date>=U.from)&&(!U.to||v.date<=U.to)).reduce((s,v)=>s+v.lines.filter(l=>l.code==='1500').reduce((t,l)=>t+(l.dr||0),0),0);
      const dep=S.vouchers.filter(v=>v.ref&&v.ref.assetId===a.id&&v.ref.kind==='DEP'&&(!U.from||v.date>=U.from)&&(!U.to||v.date<=U.to)).reduce((s,v)=>s+v.lines.filter(l=>l.code==='1510').reduce((t,l)=>t+(l.cr||0),0),0);
      return{a,ob,add,dep,cb}});
    body=`<div class="card"><b>Book value: open / close</b><div class="mut" style="font-size:11px;margin-bottom:8px">${U.from||'Beginning'} to ${U.to}</div>
    ${tbl(['Asset','Opening NBV','Additions','Depreciation','Closing NBV'],rows.map(r=>`<tr><td>${esc(r.a.name)}</td><td class="num">${npr(r.ob)}</td><td class="num">${npr(r.add)}</td><td class="num">${r.dep?'('+npr(r.dep)+')':'0'}</td><td class="num"><b>${npr(r.cb)}</b></td></tr>`).join('')+
    `<tr><td><b>Total</b></td><td class="num"><b>${npr(rows.reduce((s,r)=>s+r.ob,0))}</b></td><td class="num"><b>${npr(rows.reduce((s,r)=>s+r.add,0))}</b></td><td class="num"><b>${npr(rows.reduce((s,r)=>s+r.dep,0))}</b></td><td class="num"><b>${npr(rows.reduce((s,r)=>s+r.cb,0))}</b></td></tr>`,'No fixed assets yet.')}</div>`;
  }else{
    const rev=S.vouchers.filter(v=>v.type==='FA'&&v.ref&&v.ref.kind==='REVAL'&&(!U.from||v.date>=U.from)&&(!U.to||v.date<=U.to));
    const amtOf=v=>v.lines.filter(l=>l.code==='1500').reduce((s,l)=>s+(l.dr||0),0);
    const rows=rev.map(v=>{const a=S.assets.find(x=>x.id===v.ref.assetId)||{};return`<tr><td>${v.date}</td><td>${esc(a.name||v.ref.assetId)}</td><td>${esc(v.narration)}</td><td class="num">${npr(amtOf(v))}</td></tr>`}).join('');
    body=`<div class="card"><b>Appreciation / revaluation report</b><div class="mut" style="font-size:11px;margin-bottom:8px">${U.from||'Beginning'} to ${U.to}</div>${tbl(['Date','Asset','Note','Increase'],rows+`<tr><td colspan="3"><b>Total</b></td><td class="num"><b>${npr(rev.reduce((s,v)=>s+amtOf(v),0))}</b></td></tr>`,'No revaluations recorded.')}
    <p class="mut" style="font-size:11px;margin-top:8px">Use "Revalue" on the Fixed assets screen to record an upward revaluation.</p></div>`;
  }
  return tabsHtml+range+`<div id="arptBody">${body}</div>`;
};

/* ---- fiscal year-end closing (Ashadh end) ---- */
NAV.push({id:'fyclose',l:'Year-end closing',ic:'\u2691',g:'Accounts',r:['Admin','Principal']});
VIEWS.fyclose=()=>{const hist=(S.closings||[]).slice().sort((a,b)=>b.to.localeCompare(a.to));
  return`<div class="card"><b>Fiscal year-end closing</b><p class="mut" style="margin:6px 0 10px;font-size:12px">Nepal's fiscal year ends on the last day of Ashadh (mid-July). Running this posts one closing voucher that zeroes each income and expense account for the period below and carries the net profit or loss into General Reserve, so next year's Profit &amp; Loss starts fresh. This cannot be undone from within the app, so check the Financial statements report for the period first.</p>
  <form onsubmit="runFyClose(event)" class="grid grid-cols-3 gap-3">
   ${fld('Fiscal year label *',`<input class="inp" name="fy" required placeholder="2082/83" value="${(S.tax&&S.tax.fy)||''}">`)}
   ${fld('FY start date (1 Shrawan) *',`<input class="inp" type="date" name="from" required>`)}
   ${fld('FY end date (Ashadh end) *',`<input class="inp" type="date" name="to" required value="${today()}">`)}
   <div class="col-span-3" style="text-align:right"><button class="btn dan">${isChk()?'Run year-end closing':'Send for approval'}</button></div>
  </form></div>
  <div class="card mt-3"><b>Closing history</b>${tbl(['Fiscal year','Period','Net result','Closed on'],hist.map(c=>`<tr><td>${esc(c.fy)}</td><td>${c.from} to ${c.to}</td><td class="num ${c.net>=0?'pos':'neg'}">${c.net>=0?'Profit ':'Loss '}${npr(Math.abs(c.net))}</td><td>${c.date}</td></tr>`).join(''),'No fiscal year has been closed yet.')}</div>`;
};
function runFyClose(e){e.preventDefault();const f=fd(e);
  if(!confirm(`Close FY ${f.fy} (${f.from} to ${f.to})? This posts a permanent closing entry.`))return;
  dispatch('CLOSE_FY',{fy:f.fy.trim(),from:f.from,to:f.to},`Fiscal year closing FY ${f.fy.trim()}`,'ACCOUNTS');
}

/* ---------------- boot ---------------- */
(async function boot(){
  try{const t=localStorage.getItem(TH_KEY);if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
  await loadData();
  try{const id=sessionStorage.getItem(SS_KEY);const u=id&&S.users.find(x=>x.id===id&&x.active);if(u){CU=u;cur=HOME[u.role]}}catch(e){}
  render();persist();
})();
</script>
