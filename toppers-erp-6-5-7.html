<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TOPPERS Academy ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#eef0f3;--panel:#ffffff;--panel2:#f4f5f7;--line:#d7dbe2;--txt:#1b2430;--mut:#5c6472;
  --pri:#173a5e;--ok:#1f6b4a;--dan:#8f2c3b;--warn:#8a6414;--inp:#ffffff;--sel:#e7ebf1;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10151d;--panel:#161d28;--panel2:#1b2330;--line:#2c3645;--txt:#e3e7ee;--mut:#98a1b0;--pri:#7f9cc0;--ok:#5aa985;--dan:#d98a95;--warn:#d1ac5c;--inp:#0f151f;--sel:#212b3a}
}
:root[data-theme="dark"]{--bg:#10151d;--panel:#161d28;--panel2:#1b2330;--line:#2c3645;--txt:#e3e7ee;--mut:#98a1b0;--pri:#7f9cc0;--ok:#5aa985;--dan:#d98a95;--warn:#d1ac5c;--inp:#0f151f;--sel:#212b3a}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px}
.hidden{display:none!important}
.doc-face{font-family:'Source Serif 4',Georgia,serif}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.02em}
.inp{width:100%;padding:8px 10px;border:1px solid var(--line);background:var(--inp);color:var(--txt);border-radius:4px;font-size:13px;font-family:inherit}
.inp:focus{outline:2px solid var(--pri);outline-offset:0}
textarea.inp{min-height:90px}
.btn{padding:7px 12px;border-radius:4px;font-weight:700;font-size:12px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(.97)}
.btn:focus-visible,.nav:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.dan{background:var(--dan);color:#fff;border-color:var(--dan)}
.btn.warn{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn.sm{padding:3px 8px;font-size:11px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:var(--mut);padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:hover td{background:var(--panel2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:var(--mut)}.pos{color:var(--ok)}.neg{color:var(--dan)}.pri-t{color:var(--pri)}.warn-t{color:var(--warn)}
.badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10px;font-weight:700;background:var(--sel);color:var(--pri);border:1px solid var(--line)}
.badge.ok{background:var(--panel2);color:var(--ok);border-color:var(--ok)}
.badge.dan{background:var(--panel2);color:var(--dan);border-color:var(--dan)}
.badge.warn{background:var(--panel2);color:var(--warn);border-color:var(--warn)}
.nav{display:flex;gap:10px;align-items:center;width:100%;padding:8px 12px;border-radius:4px;font-size:13px;font-weight:600;color:var(--mut);background:none;border:0;border-left:3px solid transparent;cursor:pointer;text-align:left;font-family:inherit}
.nav:hover{background:var(--panel2)}
.nav.act{background:var(--sel);color:var(--pri);border-left-color:var(--pri)}
.grp{font-size:11.5px;font-weight:800;color:var(--pri);padding:12px 12px 4px;text-transform:uppercase;letter-spacing:.04em}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.tabs button{padding:6px 12px;border-radius:4px;border:1px solid transparent;font-weight:700;font-size:12px;cursor:pointer;background:transparent;color:var(--mut);font-family:inherit}
.tabs button.act{background:var(--panel2);color:var(--pri);border-color:var(--line)}
.overlay{position:fixed;inset:0;background:rgba(15,20,28,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#1b2430;color:#fff;padding:10px 16px;border-radius:4px;font-weight:600;font-size:12px;opacity:0;pointer-events:none;transition:all .2s;z-index:100;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--dan)}
.paper{--txt:#000;--mut:#444;--panel:#fff;--panel2:#f3f3f3;--line:#bbb;--pos:#000;background:#fff;color:#000;padding:16px}
.paper .pos,.paper .neg,.paper .mut{color:#000}
#sidebar{width:264px;transition:margin .2s}
#sidebar.collapsed{margin-left:-264px}
@media (max-width:900px){#sidebar{position:fixed;z-index:50;top:0;bottom:0;left:0;margin-left:-264px;box-shadow:0 0 30px rgba(0,0,0,.3)}#sidebar.open{margin-left:0}}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  #app,#modal,#login,#toast{display:none!important}
  #printableArea{display:block!important;position:absolute;left:0;top:0;width:100%}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background:var(--bg)">
  <div class="card w-full" style="max-width:420px;padding:26px">
    <div id="loginAddress" style="font-size:11px;font-weight:700;color:var(--mut)">Kot Malakand, Birgunj</div>
    <h1 id="loginSchool" class="doc-face" style="font-size:21px;font-weight:700;margin:2px 0 2px">TOPPERS Academy</h1>
    <p class="mut" style="margin:0 0 14px">School ERP: accounts, academics, payroll and portals.</p>
    <div id="loginErr" class="hidden" style="background:rgba(217,45,75,.12);color:var(--dan);padding:8px 10px;border-radius:8px;font-weight:600;margin-bottom:10px"></div>
    <form onsubmit="doLogin(event)" class="space-y-3">
      <div><label class="lbl">Sign in as</label>
        <select class="inp" name="portal" id="loginPortal" onchange="loginHint()">
          <option value="Admin">Administrator / Principal</option>
          <option value="Staff">Accountant / Staff</option>
          <option value="Teacher">Teacher</option>
          <option value="Parent">Parent</option>
        </select></div>
      <div><label class="lbl">Username or email</label><input class="inp" name="ident" required autocomplete="username" /></div>
      <div><label class="lbl">Password</label><input class="inp" type="password" name="pass" required autocomplete="current-password" /></div>
      <button class="btn pri" style="width:100%;padding:10px;font-size:13px" type="submit">Sign in</button>
    </form>
    <button type="button" id="bioLoginBtn" class="btn hidden" style="width:100%;padding:10px;font-size:13px;margin-top:8px" onclick="bioLogin()">🔒 Sign in with biometrics</button>
    <p id="loginHintTxt" class="mut" style="margin:12px 0 0;font-size:11px"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden flex h-full">
  <aside id="sidebar" class="flex flex-col shrink-0" style="background:var(--panel);border-right:1px solid var(--line)">
    <div style="padding:14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center">
      <div id="sbLogo" style="width:40px;height:40px;border-radius:10px;background:var(--sel);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--pri);overflow:hidden">T</div>
      <div style="min-width:0"><div id="sbName" class="doc-face truncate" style="font-weight:700;font-size:14px">TOPPERS</div><div id="sbPan" class="mut" style="font-size:10px"></div></div>
    </div>
    <nav id="sbNav" class="flex-1 overflow-y-auto" style="padding:6px 10px"></nav>
    <div style="padding:10px;border-top:1px solid var(--line)">
      <div id="sbUser" style="font-weight:700;font-size:12px" class="truncate"></div>
      <div id="sbRole" class="mut" style="font-size:10px;margin-bottom:8px"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn sm" onclick="openPwModal()">Password</button>
        <button class="btn sm" onclick="toggleTheme()">Theme</button>
        <button class="btn sm dan" onclick="logout()">Sign out</button>
      </div>
    </div>
  </aside>
  <div class="flex-1 flex flex-col min-w-0" style="height:100%">
    <header style="height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn sm" onclick="toggleSidebar()" aria-label="Toggle menu">☰</button>
        <h2 id="viewTitle" style="font-size:15px;font-weight:800;margin:0"></h2>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
        <span id="saveState" class="mut" style="font-size:11px"></span>
        <button id="hdrStack" class="btn sm" onclick="switchView('stack')"></button>
        <span id="hdrBackup" style="display:flex;gap:6px">
          <button class="btn sm" onclick="exportData()">Export backup</button>
          <label class="btn sm" style="cursor:pointer">Import<input type="file" accept=".json" class="hidden" onchange="importData(this)" /></label>
        </span>
      </div>
    </header>
    <main id="main" class="flex-1 overflow-y-auto" style="padding:16px"></main>
  </div>
</div>

<div id="modal" class="hidden overlay" onmousedown="if(event.target===this)closeModal()">
  <div id="modalBox" class="modalbox" style="max-width:520px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3 id="modalTitle" style="margin:0;font-size:15px;font-weight:800"></h3>
      <button class="btn sm" onclick="closeModal()" aria-label="Close">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<div id="printableArea" class="hidden paper"></div>

<script>
/* =========================================================================
   TOPPERS ACADEMY ERP  -  single-file build
   Every change goes through dispatch(): Admin/Principal post directly,
   everyone else stages into the Approval Stack (maker-checker).
   All money movement is double-entry vouchers; balances are derived from them.
   ========================================================================= */
const LS_KEY='TOPPERS_ERP_V2', SS_KEY='TOPPERS_SESSION_V2', TH_KEY='TOPPERS_THEME';
const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
/* ---- Nepali (Bikram Sambat) calendar display - approximate, for reference only ----
   Gives the correct BS year and month reliably, and the day within ±1 (rarely ±2) of the
   official Patro, since exact BS month lengths vary year to year and no live calendar
   service is available here to verify against. Good enough to label receipts/reports;
   spot-check a known date against an official Patro before relying on it for anything legal. */
const BS_MONTHS=['Baishakh','Jestha','Ashadh','Shrawan','Bhadra','Ashwin','Kartik','Mangsir','Poush','Magh','Falgun','Chaitra'];
const BS_BOUND=[{day:14,month:9},{day:13,month:10},{day:14,month:11},{day:13,month:0},{day:15,month:1},{day:15,month:2},{day:16,month:3},{day:17,month:4},{day:17,month:5},{day:17,month:6},{day:16,month:7},{day:16,month:8}];
function bsApprox(dateStr){
  const d=new Date(dateStr+'T00:00:00');if(isNaN(d))return null;
  const y=d.getFullYear(),m=d.getMonth(),day=d.getDate(),b=BS_BOUND[m];
  let bsMonth,bsDay;
  if(day>=b.day){bsMonth=b.month;bsDay=day-b.day+1}
  else{const prevB=BS_BOUND[(m+11)%12];bsMonth=(b.month+11)%12;const daysInPrevMonth=new Date(y,m,0).getDate();bsDay=(daysInPrevMonth-prevB.day+1)+day}
  const offset=(m>3||(m===3&&day>=b.day))?57:56;
  return{year:y+offset,month:bsMonth,day:bsDay,name:BS_MONTHS[bsMonth]};
}
function bsLabel(dateStr){const b=dateStr&&bsApprox(dateStr);return b?(b.day+' '+b.name+' '+b.year+' BS'):''}
function bsMonthLabel(ym){if(!ym)return'';const b=bsApprox(ym+'-15');return b?('≈ '+b.name+' '+b.year+' BS'):''}
const monthNow=()=>today().slice(0,7);
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const r2=n=>Math.round((+n||0)*100)/100;
const npr=n=>'रू '+r2(n).toLocaleString('en-IN');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ---------------- Nepali Unicode (Roman -> Devanagari) phonetic transliteration ---------------- */
const NP_VOWELS={'aa':['आ','ा'],'A':['आ','ा'],'ee':['ई','ी'],'I':['ई','ी'],'oo':['ऊ','ू'],'U':['ऊ','ू'],'ai':['ऐ','ै'],'au':['औ','ौ'],
 'a':['अ',''],'i':['इ','ि'],'u':['उ','ु'],'e':['ए','े'],'o':['ओ','ो'],'R':['ऋ','ृ']};
const NP_CONS={'ksh':'क्ष','gy':'ज्ञ','chh':'छ','kh':'ख','gh':'घ','ch':'च','jh':'झ','ng':'ङ','ny':'ञ','yn':'ञ',
 'Th':'ठ','Dh':'ढ','T':'ट','D':'ड','N':'ण','th':'थ','dh':'ध','ph':'फ','bh':'भ','Sh':'ष','sh':'श',
 'k':'क','g':'ग','j':'ज','t':'त','d':'द','n':'न','p':'प','f':'फ','b':'ब','m':'म','y':'य','r':'र','l':'ल','v':'व','w':'व','s':'स','h':'ह'};
const NP_MOD={'M':'ं','H':'ः'};
const NP_KEYS=[...Object.keys(NP_VOWELS).map(k=>({k,t:'V'})),...Object.keys(NP_CONS).map(k=>({k,t:'C'})),...Object.keys(NP_MOD).map(k=>({k,t:'M'}))].sort((a,b)=>b.k.length-a.k.length);
function toNepaliUnicode(str){
  let out='',i=0,pend=false;
  while(i<str.length){
    let hit=null;for(const e of NP_KEYS){if(str.startsWith(e.k,i)){hit=e;break}}
    if(hit){
      if(hit.t==='C'){if(pend)out+='्';out+=NP_CONS[hit.k];pend=true}
      else if(hit.t==='V'){const[ind,matra]=NP_VOWELS[hit.k];out+=pend?matra:ind;pend=false}
      else{out+=NP_MOD[hit.k]}
      i+=hit.k.length;
    }else{out+=str[i];pend=false;i++}
  }
  return out;
}
function npAutoConvert(el){
  const v=toNepaliUnicode(el.value);
  if(v!==el.value){el.value=v;try{el.selectionStart=el.selectionEnd=v.length}catch(e){}}
}
const uid=p=>p+'-'+Math.random().toString(36).slice(2,7).toUpperCase();
const opt=(list,v,l,sel)=>list.map(x=>`<option value="${esc(v(x))}"${String(v(x))===String(sel)?' selected':''}>${esc(l(x))}</option>`).join('');
const fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target).entries())};
const fld=(l,h,c)=>`<div class="${c||''}"><label class="lbl">${l}</label>${h}</div>`;
const tbl=(h,rows,empty)=>`<div class="overflow-x-auto"><table class="tbl"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${h.length}" class="mut" style="text-align:center;padding:20px">${empty||'Nothing here yet.'}</td></tr>`}</tbody></table></div>`;
const kpi=(l,v,c,key)=>`<div class="card"${key?` style="cursor:pointer" onclick="kpiDrill('${key}')"`:''}><div class="mut" style="font-size:11px;font-weight:700">${l}</div><div class="${c||''}" style="font-size:21px;font-weight:800;margin-top:4px">${v}</div>${key?'<div class="mut" style="font-size:10px;margin-top:4px">Click for details</div>':''}</div>`;
function pendingStackRows(list){return tbl(['Ref','Module','What','Maker','Date',''],list.map(s=>`<tr><td><button class="btn sm" onclick="viewStackEntry('${s.id}')">${s.id}</button></td><td><span class="badge">${s.module}</span></td><td>${esc(s.summary)}</td><td>${esc(s.maker)}</td><td>${s.date}</td><td style="white-space:nowrap">${isChk()?`<button class="btn sm ok" onclick="kpiApprove('${s.id}',CUR_KPI)">Approve</button> <button class="btn sm dan" onclick="kpiReject('${s.id}',CUR_KPI)">Reject</button>`:'<span class="mut">Awaiting approval</span>'}</td></tr>`).join(''),'Nothing is waiting.')}
let CUR_KPI='';
function kpiApprove(id,key){approve(id);CUR_KPI=key;kpiDrill(key,true)}
function kpiReject(id,key){reject(id);CUR_KPI=key;kpiDrill(key,true)}
function kpiDrill(key,silent){CUR_KPI=key;
  const T=(t,h)=>{if(!silent)openModal(t,h,true);else{$('#modalTitle').textContent=t;$('#modalBody').innerHTML=h;$('#modal').classList.remove('hidden')}};
  if(key==='pendingApprovals'){T('Pending approvals',pendingStackRows(S.stack.filter(x=>x.status==='PENDING'&&(isChk()||x.makerId===CU.id))));return}
  if(key==='cashBank'){const m=GLB(null,null),rows=[['1010',m['1010']]].concat(S.banks.filter(b=>b.type==='BANK').map(b=>[b.glCode,m[b.glCode]]));
    T('Cash & bank balance',tbl(['Account','Balance'],rows.map(([code,x])=>`<tr><td>${esc(glOf(code).title)}</td><td class="num">${npr(x?x.nat:0)}</td></tr>`).join('')));return}
  if(key==='feeCollected'){const list=S.receipts.filter(r=>r.date.startsWith(monthNow()));
    T('Fees collected this month',tbl(['Receipt','Date','Student','Paid'],list.map(r=>`<tr><td>${r.id}</td><td>${r.date}</td><td>${esc(r.studentName)}</td><td class="num">${npr(r.paid)}</td></tr>`).join(''),'No collections yet this month.'));return}
  if(key==='feeDues'){const list=S.students.filter(s=>duesOf(s.id)>0);
    T('Students with fee dues',tbl(['Student','Class','Due'],list.map(s=>`<tr><td>${esc(s.name)}</td><td>${clsName(s.classId)}</td><td class="num neg">${npr(duesOf(s.id))}</td></tr>`).join(''),'Nobody owes fees.'));return}
  if(key==='staffAdvances'){T('Staff advances outstanding',ledgerHTML('1050','',today()));return}
  if(key==='netSurplus'){const pl=plCalc(null,null);T('Net surplus (all time)',tbl(['Item','Amount'],[['Total income',pl.income],['Total expense',pl.expense],['Net surplus',pl.net]].map(x=>`<tr><td>${x[0]}</td><td class="num">${npr(x[1])}</td></tr>`).join('')));return}
  if(key==='activeStudents'){const list=S.students.filter(s=>s.status==='Active');
    T('Active students',tbl(['Student','Class','Roll'],list.map(s=>`<tr><td>${esc(s.name)}</td><td>${clsName(s.classId)}</td><td>${esc(s.roll)}</td></tr>`).join(''),'No active students.'));return}
  if(key==='staffCount'){T('Staff members',tbl(['Name','Role','Phone'],S.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.role)}</td><td>${esc(e.phone||'-')}</td></tr>`).join('')));return}
  if(key==='myClasses'){const cls=visibleClasses();T('My classes',tbl(['Class','Students'],cls.map(c=>`<tr><td>${esc(c.name)} ${esc(c.section)}</td><td class="num">${S.students.filter(s=>s.classId===c.id&&s.status==='Active').length}</td></tr>`).join(''),'No class assigned.'));return}
  if(key==='myStudents'){const ids=visibleClasses().map(c=>c.id),list=S.students.filter(s=>ids.includes(s.classId)&&s.status==='Active');
    T('My students',tbl(['Student','Class','Roll'],list.map(s=>`<tr><td>${esc(s.name)}</td><td>${clsName(s.classId)}</td><td>${esc(s.roll)}</td></tr>`).join('')));return}
  if(key==='myPending'){T('My submissions waiting for approval',pendingStackRows(S.stack.filter(x=>x.makerId===CU.id&&x.status==='PENDING')));return}
  if(key==='resultsOnFile'){const ids=visibleClasses().map(c=>c.id),list=S.results.filter(r=>ids.includes(r.classId));
    T('Results on file',tbl(['Student','Term','Subject','Marks','Grade'],list.slice(0,100).map(r=>`<tr><td>${esc((stuOf(r.studentId)||{}).name)}</td><td>${r.term}</td><td>${esc(r.subject)}</td><td>${r.marks}/${r.full}</td><td>${r.grade}</td></tr>`).join(''),'No results yet.'));return}
  if(key==='kidFeeDue'){const st=pickKid();if(!st)return;
    T('Fee receipts',tbl(['Receipt','Date','Billed','Paid','Balance'],S.receipts.filter(r=>r.studentId===st.id).map(r=>`<tr><td>${r.id}</td><td>${r.date}</td><td class="num">${npr(r.net)}</td><td class="num">${npr(r.paid)}</td><td class="num">${npr(r.net-r.paid)}</td></tr>`).join(''),'No receipts yet.'));return}
  if(key==='kidLatestResult'){const st=pickKid();if(!st)return;const last=[...new Set(S.results.filter(r=>r.studentId===st.id).map(r=>r.term))].sort((a,b)=>TERMS.indexOf(b)-TERMS.indexOf(a))[0];

/* ---------------- ledger engine ---------------- */
function postVoucher(v){
  v.lines=v.lines.filter(l=>(l.dr||0)||(l.cr||0)).map(l=>({code:l.code,dr:r2(l.dr||0),cr:r2(l.cr||0)}));
  const d=r2(v.lines.reduce((s,l)=>s+l.dr,0)),c=r2(v.lines.reduce((s,l)=>s+l.cr,0));
  if(!v.lines.length||Math.abs(d-c)>0.01)throw new Error('Voucher is not balanced (Dr '+d+' vs Cr '+c+')');
  v.lines.forEach(l=>{if(!glOf(l.code))throw new Error('Unknown account '+l.code)});
  v.id=v.id||voucherNo();S.vouchers.push(v);return v;
}
function GLB(from,to){
  const m={};S.gl.forEach(a=>m[a.code]={open:a.opening||0,dr:0,cr:0});
  S.vouchers.forEach(v=>v.lines.forEach(l=>{const x=m[l.code];if(!x)return;
    if(from&&v.date<from)x.open+=(l.dr||0)-(l.cr||0);else if(!to||v.date<=to){x.dr+=l.dr||0;x.cr+=l.cr||0}}));
  S.gl.forEach(a=>{const x=m[a.code];x.net=x.open+x.dr-x.cr;x.nat=isDrN(a)?x.net:-x.net});
  return m;
}
function plCalc(from,to){
  const m=GLB(from,to),inc=[],exp=[];let ti=0,te=0;
  S.gl.forEach(a=>{const x=m[a.code];
    if(a.map==='PL_INCOME'){const v=(x.cr-x.dr)+(from?0:-x.open);if(v||1){inc.push({a,v});ti+=v}}
    if(a.map==='PL_EXPENSE'){const v=(x.dr-x.cr)+(from?0:x.open);exp.push({a,v});te+=v}});
  return{inc,exp,ti:r2(ti),te:r2(te),net:r2(ti-te)};
}
function ledgerData(code,from,to){
  const a=glOf(code),sign=isDrN(a)?1:-1;let open=a.opening||0;const rows=[];
  S.vouchers.slice().sort((x,y)=>x.date.localeCompare(y.date)||x.id.localeCompare(y.id)).forEach(v=>v.lines.filter(l=>l.code===code).forEach(l=>{
    const net=(l.dr||0)-(l.cr||0);if(from&&v.date<from)open+=net;else if(!to||v.date<=to)rows.push({v,l})}));
  let run=open*sign;rows.forEach(r=>{run+=((r.l.dr||0)-(r.l.cr||0))*sign;r.bal=run});
  return{a,sign,open:open*sign,rows,close:run};
}
function ledgerHTML(code,from,to){
  const d=ledgerData(code,from,to);

/* ---------------- payroll & tax ---------------- */
function calcTax(annual,ssf){
  let prev=0,tax=0;
  S.tax.slabs.forEach((s,i)=>{const up=s.upto==null?Infinity:s.upto;
    if(annual>prev){const amt=Math.min(annual,up)-prev;let rate=s.rate;if(i===0&&ssf&&S.tax.waiveFirst)rate=0;tax+=amt*rate/100}prev=up});
  return r2(tax);
}
function calcPay(e,i){
  const basic=num(i.basic),allow=num(i.allow),bonus=num(i.bonus),other=num(i.other),adv=num(i.advRec);
  const gross=basic+allow+bonus,ssf=!!e.ssf;
  const empSSF=ssf?Math.round(basic*S.tax.ssfEmp/100):0,erSSF=ssf?Math.round(basic*S.tax.ssfEr/100):0;
  const assess=(gross+erSSF)*12,ded=ssf?Math.min((empSSF+erSSF)*12,S.tax.retCap,assess/3):0;
  const taxable=Math.max(0,assess-ded),annualTax=calcTax(taxable,ssf),tds=Math.round(annualTax/12);
  return{basic,allow,bonus,other,advRec:adv,gross,empSSF,erSSF,taxable,annualTax,tds,net:gross-empSSF-tds-adv-other};
}

/* ---------------- dispatch (maker-checker) ---------------- */
function dispatch(action,payload,summary,module){
  if(isChk()){
    try{APPLY[action](payload);persist();render();toast(summary+' - done');return true}
    catch(e){alert('Could not complete: '+e.message);return false}
  }
  S.stack.unshift({id:nextSeq('stk','STK'),module,action,payload,summary,maker:CU.name,makerId:CU.id,date:today(),status:'PENDING'});
  persist();render();toast('Sent to the Approval Stack for Principal/Admin');return true;
}
function approve(id){const it=S.stack.find(x=>x.id===id);if(!it)return;
  try{APPLY[it.action](it.payload);it.status='APPROVED';it.checker=CU.name;it.checkDate=today();persist();render();toast('Approved and posted '+id)}
  catch(e){alert('Cannot post '+id+': '+e.message)}}
function reject(id){const it=S.stack.find(x=>x.id===id);if(!it)return;const why=prompt('Reason for rejecting (optional):','');if(why===null)return;
  it.status='REJECTED';it.reason=why;it.checker=CU.name;it.checkDate=today();persist();render();toast('Rejected '+id)}

const FIELD_LABELS={studentId:'Student',subjectId:'Student',subjectKey:'Staff member',subjectName:'Staff member',subjectRole:'Role',classId:'Class',date:'Date',from:'From date',to:'To date',inTime:'Check-in time',outTime:'Check-out time',remarks:'Remarks',reason:'Reason',type:'Leave type',days:'Days',net:'Net amount',paid:'Amount paid',discount:'Discount',mode:'Pay to',note:'Note',term:'Term',subject:'Subject',marks:'Marks',full:'Full marks',pass:'Passing marks',lat:'Latitude',lng:'Longitude',radius:'Allowed radius (m)',workStart:'Work start',workEnd:'Work end',graceMin:'Late grace (min)',earlyMin:'Early margin (min)',geoEnabled:'GPS required',heads:'Fee heads',tuition:'Tuition',admission:'Admission fee',annual:'Annual fee',activity:'Activity fee',library:'Library fee',exam:'Exam fee',transport:'Transport',other:'Other',invoiceId:'Monthly bill',amount:'Amount',items:'Entries'};
function prettyKey(k){return FIELD_LABELS[k]||k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase())}
function prettyVal(k,v,depth){
  depth=depth||0;
  if(v===null||v===undefined||v==='')return'-';
  if(k==='studentId'){const s=stuOf(v);return s?esc(s.name)+' ('+clsName(s.classId)+')':esc(String(v))}
  if(k==='subjectKey'){const s=staffOfKey(v);return s?esc(s.name):esc(String(v))}
  if(k==='classId')return esc(clsName(v));
  if(k==='invoiceId'){const inv=S.feeInvoices.find(x=>x.id===v);return inv?monthLabel(inv.month)+' - '+esc(inv.studentName):esc(String(v))}
  if(Array.isArray(v))return v.length?v.map(x=>typeof x==='object'?objToLines(x,depth+1):esc(String(x))).join('<hr style="margin:6px 0;opacity:.15">'):'-';
  if(typeof v==='object')return objToLines(v,depth+1);
  if(typeof v==='boolean')return v?'Yes':'No';
  if(typeof v==='number'&&/amount|net|paid|discount|fee|fine|tuition|admission|annual|activity|library|exam|transport|other/i.test(k))return npr(v);
  return esc(String(v));
}
function objToLines(obj,depth){
  return Object.entries(obj).filter(([k,v])=>v!==undefined&&v!==''&&k!=='id').map(([k,v])=>`<div style="${depth?'margin-left:'+(depth*12)+'px':''}"><b>${prettyKey(k)}:</b> ${prettyVal(k,v,depth)}</div>`).join('');
}
function viewStackEntry(id){
  const s=S.stack.find(x=>x.id===id);if(!s){alert('This entry is no longer available.');return}
  const rows=Object.entries(s.payload||{}).filter(([k,v])=>v!==undefined&&v!==''&&k!=='id').map(([k,v])=>`<div class="col-span-2" style="padding:8px 10px;background:var(--panel2);border-radius:8px"><b>${prettyKey(k)}:</b> ${prettyVal(k,v)}</div>`).join('');
  openModal('Submitted by '+esc(s.maker),`<div class="mut" style="margin-bottom:10px">Ref ${s.id} &middot; <span class="badge">${esc(s.module)}</span> &middot; ${s.date} &middot; ${esc(s.summary)}</div>
   <div class="grid grid-cols-2 gap-2">${rows||'<div class="col-span-2 mut">No details recorded for this entry.</div>'}</div>
   ${s.status!=='PENDING'?`<p class="mut" style="margin-top:10px">${stBadge(s.status)} by ${esc(s.checker||'-')} on ${s.checkDate||'-'}${s.reason?' - '+esc(s.reason):''}</p>`:''}
   <div style="text-align:right;margin-top:16px">${closeBtn()}${isChk()&&s.status==='PENDING'?` <button class="btn ok" onclick="closeModal();approve('${s.id}')">Approve</button> <button class="btn dan" onclick="closeModal();reject('${s.id}')">Reject</button>`:''}</div>`,true);
}

function ensureParentUser(st){
  const em=(st.parentEmail||'').trim().toLowerCase();if(!em)return;
  let u=S.users.find(x=>x.role==='Parent'&&x.username.toLowerCase()===em);
  if(u){u.children=u.children||[];if(!u.children.includes(st.id))u.children.push(st.id)}
  else S.users.push({id:uid('U'),username:em,password:'parent123',name:st.parentName||'Parent',role:'Parent',children:[st.id],active:true});
}
function ensureStaffUser(e){
  const role=e.role==='Principal'?'Principal':(e.role==='Accountant'||e.role==='Staff')?'Staff':'Teacher';
  const un=(e.email||e.name).split('@')[0].toLowerCase().replace(/\s+/g,'');
  if(S.users.some(u=>u.username.toLowerCase()===un))return;
  S.users.push({id:uid('U'),username:un,password:role==='Teacher'?'teach123':'staff123',name:e.name,role,linkId:e.id,active:true});
}
function nextCode(start){let c=start;while(glOf(String(c)))c++;return String(c)}
function nextClass(st){const c=clsOf(st.classId);if(!c)return null;const cand=S.classes.filter(x=>x.level===c.level+1);return cand.find(x=>x.section===c.section)||cand[0]||null}
function prevClass(st){const c=clsOf(st.classId);if(!c)return null;const cand=S.classes.filter(x=>x.level===c.level-1);return cand.find(x=>x.section===c.section)||cand[0]||null}
function finalStat(sid){
  const rs=S.results.filter(r=>r.studentId===sid&&r.term==='Final Examination');if(!rs.length)return null;
  const f=rs.reduce((s,r)=>s+r.full,0),m=rs.reduce((s,r)=>s+r.marks,0);return{pct:f?r2(m/f*100):0,allPass:rs.every(r=>r.passed),n:rs.length};
}

    if(S.vouchers.some(v=>v.type!=='OPEN'&&v.lines.some(l=>l.code===b.glCode)))throw new Error('This account has transactions. Delete them first.');
    if(b.glCode==='1020'||b.glCode==='2010')throw new Error('Default account cannot be deleted; rename it instead');
    S.vouchers=S.vouchers.filter(v=>!(v.type==='OPEN'&&v.ref&&v.ref.bankId===b.id));S.gl=S.gl.filter(a=>a.code!==b.glCode);S.banks=S.banks.filter(x=>x.id!==b.id)},
  BANK_TXN(p){const b=bankOf(p.bankId);if(!b)throw new Error('Select a bank account');const amt=r2(p.amount);if(amt<=0)throw new Error('Amount must be greater than zero');
    if(!glOf(p.contra)||p.contra===b.glCode)throw new Error('Choose a different contra account');
    const lines=p.side==='DR'?[{code:b.glCode,dr:amt},{code:p.contra,cr:amt}]:[{code:p.contra,dr:amt},{code:b.glCode,cr:amt}];
    if(p.id){const v=S.vouchers.find(x=>x.id===p.id);if(!v||v.type!=='BANK')throw new Error('Transaction not found');
      v.date=p.date;v.narration=p.narration;v.lines=lines.map(l=>({code:l.code,dr:l.dr||0,cr:l.cr||0}));v.meta={refNo:p.refNo,side:p.side,contra:p.contra}}
    else postVoucher({date:p.date,type:'BANK',ref:{bankId:b.id},meta:{refNo:p.refNo,side:p.side,contra:p.contra},narration:p.narration,lines})},
  SAVE_ASSET(p){const cost=r2(p.cost);if(cost<=0)throw new Error('Cost must be greater than zero');
    const fundCode=p.fund==='CASH'?'1010':p.fund==='PAYABLE'?'2040':p.fund==='RESERVE'?'3010':payGL(p.fund);
    if(p.id){const a=S.assets.find(x=>x.id===p.id);if(!a)throw new Error('Asset not found');
      Object.assign(a,{name:p.name,cost,rate:num(p.rate),method:p.method,date:p.date,fund:p.fund});
      const v=S.vouchers.find(x=>x.ref&&x.ref.assetId===a.id&&x.ref.kind==='BUY');
      if(v){v.date=p.date;v.narration='Purchase: '+p.name;v.lines=[{code:'1500',dr:cost,cr:0},{code:fundCode,dr:0,cr:cost}]}}
    else{const a={id:nextSeq('fa','FA'),name:p.name,cost,rate:num(p.rate),method:p.method,date:p.date,fund:p.fund,depFYs:[]};S.assets.push(a);
      postVoucher({date:p.date,type:'FA',ref:{assetId:a.id,kind:'BUY'},narration:'Purchase: '+p.name,lines:[{code:'1500',dr:cost},{code:fundCode,cr:cost}]})}},
  DEL_ASSET(p){S.vouchers=S.vouchers.filter(v=>!(v.ref&&v.ref.assetId===p.id));S.assets=S.assets.filter(a=>a.id!==p.id)},
  RUN_DEP(p){let n=0;if(!p.fy)throw new Error('Enter the fiscal year label');
    S.assets.forEach(a=>{if(a.depFYs.includes(p.fy))return;const nbv=a.cost-assetDep(a),base=a.method==='SL'?a.cost:nbv,amt=Math.min(nbv,Math.round(base*a.rate/100));
      if(amt<=0)return;postVoucher({date:p.date,type:'FA',ref:{assetId:a.id,kind:'DEP',fy:p.fy},narration:`Depreciation FY ${p.fy}: ${a.name}`,lines:[{code:'5030',dr:amt},{code:'1510',cr:amt}]});a.depFYs.push(p.fy);n++});
    if(!n)throw new Error('Nothing to depreciate for FY '+p.fy+' (already run, or fully depreciated)')},
  REVALUE_ASSET(p){const a=S.assets.find(x=>x.id===p.id);if(!a)throw new Error('Asset not found');const amt=r2(p.amount);if(amt<=0)throw new Error('Amount must be greater than zero');
    a.cost=r2(a.cost+amt);
    postVoucher({date:p.date,type:'FA',ref:{assetId:a.id,kind:'REVAL'},narration:`Revaluation (appreciation): ${a.name}${p.note?' - '+p.note:''}`,lines:[{code:'1500',dr:amt},{code:'3020',cr:amt}]})},
  DROP_STUDENT(p){const s=stuOf(p.id);if(!s)throw new Error('Student not found');s.status=p.status;s.leaveDate=p.leaveDate;s.leaveReason=p.reason||'';s.conduct=p.conduct||'Good'},
  CLOSE_FY(p){S.closings=S.closings||[];if(S.closings.some(c=>c.fy===p.fy))throw new Error('FY '+p.fy+' is already closed');
    const pl=plCalc(p.from,p.to);if(!pl.inc.some(x=>x.v)&&!pl.exp.some(x=>x.v))throw new Error('No income or expense activity found for this period');
    const lines=[];pl.inc.forEach(x=>{if(x.v)lines.push({code:x.a.code,dr:x.v})});pl.exp.forEach(x=>{if(x.v)lines.push({code:x.a.code,cr:x.v})});
    const net=r2(pl.net);if(net>=0)lines.push({code:'3010',cr:net});else lines.push({code:'3010',dr:-net});
    postVoucher({date:p.to,type:'CLOSE',ref:{fy:p.fy},narration:`Fiscal year closing FY ${p.fy}: transfer of net ${net>=0?'profit':'loss'} to General Reserve`,lines});
    S.closings.push({id:uid('CLS'),fy:p.fy,from:p.from,to:p.to,net,date:today()})},
  ISSUE_ADV(p){const e=empOf(p.empId),amt=r2(p.amount);if(!e)throw new Error('Select a staff member');if(amt<=0)throw new Error('Amount must be greater than zero');
    const a={id:nextSeq('adv','ADV'),empId:e.id,date:p.date,amount:amt,recovered:0,note:p.note||''};
    S.advances.unshift(a);postVoucher({date:p.date,type:'ADV',ref:{advId:a.id},narration:`Staff advance: ${e.name}`,lines:[{code:'1050',dr:amt},{code:payGL(p.mode),cr:amt}]})},
  DEL_ADV(p){const a=S.advances.find(x=>x.id===p.id);if(!a)throw new Error('Advance not found');if(a.recovered>0)throw new Error('Part of this advance was already recovered through payroll');
    if(a.opening)throw new Error('Opening advance is part of opening balances');S.vouchers=S.vouchers.filter(v=>!(v.ref&&v.ref.advId===a.id));S.advances=S.advances.filter(x=>x.id!==a.id)},
  POST_PAYROLL(p){
    p.list.forEach(row=>{const e=empOf(row.empId);if(!e)throw new Error('Staff not found');
      if(S.payroll.some(x=>x.empId===e.id&&x.month===p.month))throw new Error(`${e.name} is already paid for ${p.month}`)});
    p.list.forEach(row=>{const e=empOf(row.empId);let adv=Math.min(num(row.advRec),advOut(e.id));
      const c=calcPay(e,{...row,advRec:adv});if(c.net<0)throw new Error(`${e.name}: deductions exceed pay`);
      const id=nextSeq('pay','PAY');
      const v=postVoucher({date:p.date,type:'PAY',ref:{payId:id},narration:`Salary ${p.month}: ${e.name}`,lines:[
        {code:'5010',dr:c.gross},{code:'5020',dr:c.erSSF},{code:'2030',cr:c.empSSF+c.erSSF},{code:'2020',cr:c.tds},{code:'1050',cr:adv},{code:'2040',cr:c.other},{code:payGL(p.mode),cr:c.net}]});
      const applied=[];let left=adv;S.advances.filter(a=>a.empId===e.id).slice().reverse().forEach(a=>{if(left<=0)return;const t=Math.min(left,a.amount-a.recovered);if(t>0){a.recovered=r2(a.recovered+t);applied.push({advId:a.id,amt:t});left-=t}});
      S.payroll.unshift({id,month:p.month,date:p.date,empId:e.id,empName:e.name,role:e.role,mode:p.mode,...c,advApplied:applied,voucherId:v.id})})},
  DEL_PAYROLL(p){const r=S.payroll.find(x=>x.id===p.id);if(!r)throw new Error('Record not found');
    (r.advApplied||[]).forEach(x=>{const a=S.advances.find(y=>y.id===x.advId);if(a)a.recovered=r2(a.recovered-x.amt)});
    S.vouchers=S.vouchers.filter(v=>v.id!==r.voucherId);S.payroll=S.payroll.filter(x=>x.id!==p.id)},
  SAVE_EMP(p){const e=p.emp;
    if(e.id){const i=S.employees.findIndex(x=>x.id===e.id);if(i<0)throw new Error('Staff not found');S.employees[i]={...S.employees[i],...e}}
    else{e.id='EMP-'+(++S.seq.emp);S.employees.push(e);if(p.createLogin)ensureStaffUser(e)}},
  DEL_EMP(p){if(S.payroll.some(r=>r.empId===p.id)||S.advances.some(a=>a.empId===p.id))throw new Error('Staff has payroll or advance records and cannot be deleted');
    S.classes.forEach(c=>{if(c.teacherId===p.id)c.teacherId=''});S.users=S.users.filter(u=>u.linkId!==p.id);S.employees=S.employees.filter(e=>e.id!==p.id)},
  SAVE_TAX(p){S.tax=p.tax}
};
function assetDep(a){return r2(S.vouchers.filter(v=>v.ref&&v.ref.assetId===a.id&&v.ref.kind==='DEP').reduce((s,v)=>s+v.lines.filter(l=>l.code==='1510').reduce((t,l)=>t+(l.cr||0)-(l.dr||0),0),0))}

function saveClass(e,id){const f=fd(e);const subs=[];
  for(const line of f.subjects.split('\n').map(x=>x.trim()).filter(Boolean)){const p=line.split(',').map(x=>x.trim());
    if(!p[0]){alert('Check subject line: '+line);return}
    if((p[1]||'').toLowerCase()==='grade'){subs.push({name:p[0],gradeOnly:true,full:0,pass:0,ch:0});continue}
    const full=num(p[1])||100,pass=p[2]===undefined||p[2]===''?Math.round(full*0.4):num(p[2]),ch=p[3]===undefined||p[3]===''?4:num(p[3]);
    if(pass>full||full<=0){alert('Check subject line: '+line+' (pass marks cannot exceed full marks)');return}subs.push({name:p[0],full,pass,ch:ch||4})}
  if(f.substituteId&&f.substituteId===f.teacherId){alert('Substitute teacher must be different from the class teacher.');return}
  const subjectTeachers={};subs.forEach(s=>{const v=f['subT_'+s.name];if(v)subjectTeachers[s.name]=v});
  const cls={id:id||undefined,name:f.name.trim(),section:(f.section||'').trim(),level:parseInt(f.level),teacherId:f.teacherId,substituteId:f.substituteId||'',fee:num(f.fee),subjects:subs,subjectTeachers};
  if(!id&&S.classes.some(c=>c.name===cls.name&&c.section===cls.section)){alert('This class and section already exist.');return}
  if(dispatch('SAVE_CLASS',{cls},`${id?'Update':'Create'} class ${cls.name} ${cls.section}`,'CLASSES'))closeModal()}

function buildSeatPlan(classId){
  const cfg=Object.assign({room:'',perBench:2,rows:4},S.seatConfig[classId]||{});
  const students=S.students.filter(s=>s.classId===classId&&s.status==='Active').sort((a,b)=>(''+(a.roll||'')).localeCompare(''+(b.roll||''),undefined,{numeric:true}));
  const P=Math.max(1,cfg.perBench),R=Math.max(1,cfg.rows);
  const totalBenches=Math.ceil(students.length/P)||0,benchesPerRow=Math.max(1,Math.ceil(totalBenches/R));
  const benches=[];for(let i=0;i<totalBenches;i++)benches.push(students.slice(i*P,(i+1)*P));
  const grid=[];for(let r=0;r<R;r++)grid.push(benches.slice(r*benchesPerRow,(r+1)*benchesPerRow));
  return{cfg,students,benches,grid,benchesPerRow,rows:R};
}

function marksheetHTML(sid,term){
  const st=stuOf(sid),rs=S.results.filter(r=>r.studentId===sid&&r.term===term);if(!st||!rs.length)return'<p>No results recorded.</p>';
  const marked=rs.filter(r=>!r.gradeOnly),gOnly=rs.filter(r=>r.gradeOnly);
  const tf=marked.reduce((s,r)=>s+r.full,0),tm=marked.reduce((s,r)=>s+r.marks,0),pct=tf?r2(tm/tf*100):0,all=marked.every(r=>r.passed);
  const peers=S.students.filter(s=>s.classId===st.classId).map(s=>{const x=S.results.filter(r=>r.studentId===s.id&&r.term===term&&!r.gradeOnly);return{id:s.id,t:x.reduce((a,r)=>a+r.marks,0),n:x.length}}).filter(x=>x.n).sort((a,b)=>b.t-a.t);
  const rank=peers.findIndex(p=>p.id===sid)+1;
  return docHead(esc(term)+' - Marksheet')+`<table style="width:100%;font-size:12px;margin-bottom:10px"><tr><td><b>Name:</b> ${esc(st.name)}</td><td><b>Class:</b> ${clsName(st.classId)}</td><td><b>Roll:</b> ${esc(st.roll)}</td></tr><tr><td><b>Student ID:</b> ${st.id}</td><td><b>IEMIS:</b> ${esc(st.iemis||'-')}</td><td><b>Parent:</b> ${esc(st.parentName)}</td></tr></table>`+
   tbl(['Subject','Full marks','Pass marks','Obtained','%','Grade','Result'],marked.map(r=>`<tr><td>${esc(r.subject)}</td><td class="num">${r.full}</td><td class="num">${r.pass}</td><td class="num">${r.marks}</td><td class="num">${r.pct}</td><td>${r.grade}</td><td>${r.passed?'Pass':'Fail'}</td></tr>`).join('')+
   `<tr><td><b>Total</b></td><td class="num"><b>${tf}</b></td><td></td><td class="num"><b>${tm}</b></td><td class="num"><b>${pct}</b></td><td><b>${gradeOf(pct,all)}</b></td><td><b>${all?'Pass':'Fail'}</b></td></tr>`)+
   (gOnly.length?`<p style="margin-top:10px;font-size:12px"><b>Additional grade-only subjects</b> (not included in total marks/percentage):</p>`+tbl(['Subject','Grade'],gOnly.map(r=>`<tr><td>${esc(r.subject)}</td><td>${r.grade}</td></tr>`).join('')):'')+
   `<p style="margin-top:10px"><b>Percentage:</b> ${pct}% &nbsp; <b>Division:</b> ${divisionOf(pct,all)} &nbsp; <b>Rank in class:</b> ${rank}/${peers.length}</p>`+signBlock(st.classId);

function submitMarks(){
  const R=UI.res,c=clsOf(R.classId),sub=c&&c.subjects.find(s=>s.name===R.subject);
  const items=[];

    for(const s of S.students.filter(x=>x.classId===R.classId&&x.status==='Active')){const el=$('#m_'+s.id);if(!el||!el.value)continue;items.push({studentId:s.id,classId:R.classId,term:R.term,subject:R.subject,gradeOnly:true,grade:el.value})}

    return;
  }
  const full=num($('#mFull').value),pass=num($('#mPass').value);
  if(full<=0||pass<0||pass>full){alert('Check full and pass marks.');return}
  for(const s of S.students.filter(x=>x.classId===R.classId&&x.status==='Active')){const el=$('#m_'+s.id);if(!el||el.value==='')continue;const m=num(el.value);

  if(!items.length){alert('Enter marks for at least one student.');return}
  dispatch('SAVE_RESULTS',{items},`Marks: ${clsName(R.classId)}, ${R.term}, ${R.subject} (${items.length} students)`,'RESULTS');
}

function feeHeadDues(sid){
  let t=0,ex=0,tr=0,ot=0,ad=0,an=0,ac=0,li=0;
  S.receipts.filter(r=>r.studentId===sid).forEach(r=>{const bal=r.net-r.paid;if(bal<=0)return;const h=r.heads||{},net=r.net||1,ratio=bal/net;

    ad+=num(h.admission)*ratio;an+=num(h.annual)*ratio;ac+=num(h.activity)*ratio;li+=num(h.library)*ratio});
  const libFines=r2((S.charges||[]).filter(c=>c.studentId===sid&&c.src==='LIB').reduce((s,c)=>s+c.amount,0));
  return{tuition:r2(t),exam:r2(ex),transport:r2(tr),other:r2(ot),admission:r2(ad),annual:r2(an),activity:r2(ac),library:r2(li+libFines)};

  if(M.q){const q=M.q.toLowerCase();list=list.filter(s=>[s.id,s.iemis,s.regNo,s.name,s.parentName,s.motherName,s.phone,s.parentEmail].some(v=>(v||'').toLowerCase().includes(q)))}
  const aMin=M.attMin!==''?num(M.attMin):null,aMax=M.attMax!==''?num(M.attMax):null;
  if(aMin!==null)list=list.filter(s=>{const a=studentAttPct(s);return a!==''&&a>=aMin});
  if(aMax!==null)list=list.filter(s=>{const a=studentAttPct(s);return a!==''&&a<=aMax});
  const dMin=M.dueMin!==''?num(M.dueMin):null,dMax=M.dueMax!==''?num(M.dueMax):null;
  if(dMin!==null)list=list.filter(s=>duesOf(s.id)>=dMin);
  if(dMax!==null)list=list.filter(s=>duesOf(s.id)<=dMax);
  return list.slice().sort((a,b)=>clsName(a.classId).localeCompare(clsName(b.classId))||num(a.roll)-num(b.roll))}
function masterDataHeaders(){return['Student ID','IEMIS / EMIS no','Registration no','Name','Roll no','Class','Father / guardian name','Mother name','Address','Email','Phone','Status','Attendance %',
  'Tuition due','Admission due','Annual due','Activity due','Library due','Exam fee due','Transport due','Other due','Total due','Last movement','Movement date','Moved from','Moved to']
  .concat(TERMS.flatMap(t=>[t+' - % obtained',t+' - Grade',t+' - Result']))}
function masterDataRow(s){
  const fh=feeHeadDues(s.id),addr=s.permAddr||s.mailAddr||'',mv=lastMove(s);
  const base=[s.id,s.iemis||'',s.regNo||'',s.name,s.roll,clsName(s.classId),s.parentName||'',s.motherName||'',addr,s.parentEmail||'',s.phone||'',s.status,studentAttPct(s),
   fh.tuition,fh.admission,fh.annual,fh.activity,fh.library,fh.exam,fh.transport,fh.other,duesOf(s.id),
   mv?mv.type:'',mv?mv.date:'',mv?clsName(mv.fromClassId):'',mv?(mv.toClassId?clsName(mv.toClassId):'Graduated'):''];
  return base.concat(TERMS.flatMap(t=>{const st=studentTermStat(s.id,t);return[st.pct,st.grade,st.result]}));
}
function subjectWiseRows(list){
  const rows=[['Student ID','Name','Class','Roll','Terminal','Subject','Full marks','Pass marks','Obtained','%','Grade','Result']];
  list.forEach(s=>TERMS.forEach(t=>S.results.filter(r=>r.studentId===s.id&&r.term===t).forEach(r=>{
    rows.push(r.gradeOnly?[s.id,s.name,clsName(s.classId),s.roll,t,r.subject,'','','','',r.grade,'Grade only']:[s.id,s.name,clsName(s.classId),s.roll,t,r.subject,r.full,r.pass,r.marks,r.pct,r.grade,r.passed?'Pass':'Fail']);
  })));
  return rows;
}
function movementRows(list){
  const ids=list.map(s=>s.id),rows=[['Student ID','Name','Class','Date','Type','Method','From class','To class','Note','By','Status']];
  S.students.filter(s=>ids.includes(s.id)).forEach(s=>(s.history||[]).forEach(mv=>{
    rows.push([s.id,s.name,clsName(s.classId),mv.date,mv.type,mv.method,clsName(mv.fromClassId),mv.toClassId?clsName(mv.toClassId):'Graduated',mv.note||'',mv.by||'',mv.reverted?'Reverted':'Active']);
  }));
  return rows;
}
function exportMasterData(){
  if(typeof XLSX==='undefined'){alert('The Excel export library did not load - check your internet connection and try again.');return}
  const list=mdList();if(!list.length){alert('No students to export.');return}
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([masterDataHeaders()].concat(list.map(masterDataRow))),'Student Master');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(subjectWiseRows(list)),'Subject-wise Results');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(movementRows(list)),'Promotion-Demotion history');
  XLSX.writeFile(wb,'Student_Master_Data_'+today()+'.xlsx');
  toast('Excel file downloaded');
}

function autoPromote(){const ids=S.students.filter(s=>{if(s.status!=='Active')return false;const f=finalStat(s.id);return f&&f.allPass&&f.pct>=UI.promoThr}).map(s=>s.id);

function demoteOne(id){const s=stuOf(id),cls=S.classes.filter(c=>c.level<(clsOf(s.classId)||{}).level).sort((a,b)=>b.level-a.level);
  if(!cls.length){alert('No lower class exists.');return}
  const note=prompt('Reason for demotion (shown on the report):','');if(note===null)return;
  const pv=prevClass(s);
  if(!confirm(`${s.name}: ${clsName(s.classId)} to ${pv?clsName(pv.id):cls[0].name}?`))return;
  dispatch('DEMOTE',{ids:[id],classId:pv?pv.id:cls[0].id,note},`Demote ${s.name} to ${clsName((pv||cls[0]).id)}`,'PROMOTION')}

UI.mv={type:'',classId:'',from:'',to:'',q:''};
function moveList(){const M=UI.mv;let rows=[];
  S.students.forEach(s=>(s.history||[]).forEach(mv=>rows.push({s,mv})));
  if(M.type)rows=rows.filter(x=>x.mv.type===M.type);
  if(M.classId)rows=rows.filter(x=>x.mv.fromClassId===M.classId||x.mv.toClassId===M.classId);
  if(M.from)rows=rows.filter(x=>x.mv.date>=M.from);
  if(M.to)rows=rows.filter(x=>x.mv.date<=M.to);
  if(M.q)rows=rows.filter(x=>x.s.name.toLowerCase().includes(M.q.toLowerCase()));
  return rows.sort((a,b)=>(b.mv.date||'').localeCompare(a.mv.date||''));

       <td style="white-space:nowrap">${bal>0?`<button class="btn sm ok" onclick="openInvoicePay('${i.id}')">Collect</button> `:''}${i.paid===0?`<button class="btn sm dan" onclick="delInvoice('${i.id}')">Delete</button>`:''}</td></tr>`}).join(''),'No monthly bills generated yet - use "Generate monthly bills" above.')}</div>`;
  }
  return tabHtml+body;
};
function genInvoices(){const m=$('#invGenMonth').value;if(!m){alert('Pick a month first.');return}
  dispatch('GEN_INVOICES',{month:m},'Generate fee bills for '+monthLabel(m),'FEES')}
function delInvoice(id){if(confirm('Delete this bill? This cannot be undone.'))dispatch('DEL_INVOICE',{id},'Delete fee bill','FEES')}
function openInvoicePay(id){const i=S.feeInvoices.find(x=>x.id===id);if(!i)return;const bal=r2(i.net-i.paid);
  openModal('Collect payment - '+monthLabel(i.month),`<div class="mut" style="margin-bottom:10px">${esc(i.studentName)} (${esc(i.className)}) &middot; Balance ${npr(bal)}</div>
   <form onsubmit="payInvoice(event,'${id}')" class="grid grid-cols-2 gap-3">
   ${fld('Date *',`<input class="inp" type="date" name="date" required value="${today()}">`)}${fld('Pay to *',`<select class="inp" name="mode">${payOpts('CASH')}</select>`)}
   ${fld('Amount *',`<input class="inp" type="number" min="1" max="${bal}" name="amount" required value="${bal}">`,'col-span-2')}
   ${fld('Remarks',`<input class="inp" name="note">`,'col-span-2')}
   <div class="col-span-2" style="text-align:right">${closeBtn()} <button class="btn ok">${isChk()?'Record payment':'Send for approval'}</button></div></form>`);
}
function payInvoice(e,id){const f=fd(e);
  if(dispatch('COLLECT_INVOICE',{invoiceId:id,date:f.date,mode:f.mode,amount:num(f.amount),note:f.note},'Fee bill payment: '+npr(num(f.amount)),'FEES'))closeModal();
}
function feeStu(){const s=stuOf($('#fStu').value);if(!s)return;
  const libFine=r2(S.charges.filter(c=>c.studentId===s.id&&c.src==='LIB').reduce((a,c)=>a+c.amount,0));$('#fLibrary').value=libFine||0;
  const d=duesOf(s.id);$('#fDues').textContent=(d>0?`Balance due before this bill: ${npr(d)}`:d<0?`Advance on account: ${npr(-d)}`:'No previous dues.')+(libFine?` (includes ${npr(libFine)} library fine - auto-filled below, editable)`:'');feeCalc()}
function feeCalc(){const f=document.forms[0]&&$('#fStu')?$('#fStu').form:null;if(!f)return;const g=n=>f[n]?num(f[n].value):0,total=g('exam')+g('admission')+g('annual')+g('activity')+g('library')+g('other')-g('discount');
  const paid=g('paid'),bal=total-paid,sid=f.studentId&&f.studentId.value,prev=sid?duesOf(sid):0;
  $('#fPrev').innerHTML=`This bill: Net ${npr(total)} &nbsp; Paid ${npr(paid)} &nbsp; <span class="${bal>0?'neg':'pos'}">${bal>0?'Balance due on this bill':'Advance / change'} ${npr(Math.abs(bal))}</span>`
    +(sid?`<div style="font-weight:400;margin-top:4px">Total outstanding after saving (this bill + previous dues): <b class="${prev+bal>0?'neg':'pos'}">${npr(prev+bal)}</b></div>`:'')}
function submitFee(e){const f=fd(e),s=stuOf(f.studentId);
  const receipt={studentId:f.studentId,date:f.date,mode:f.mode,heads:{tuition:num(f.tuition),exam:num(f.exam),admission:num(f.admission),annual:num(f.annual),activity:num(f.activity),library:num(f.library),transport:num(f.transport),other:num(f.other)},discount:num(f.discount),paid:num(f.paid),note:f.note};
  if(dispatch('COLLECT_FEE',{receipt},`Fee: ${s.name} paid ${npr(receipt.paid)}`,'FEES'))e.target.reset()}
function delReceipt(id){if(confirm('Delete this receipt and its accounting entry?'))dispatch('DEL_RECEIPT',{id},'Delete receipt '+id,'FEES')}
function printReceipt(id){const r=S.receipts.find(x=>x.id===id);if(!r)return;const h=r.heads;
  showDoc('Fee receipt',docHead('Fee receipt')+`<table style="width:100%;font-size:12px;margin-bottom:8px"><tr><td><b>Receipt:</b> ${r.id}</td><td style="text-align:right"><b>Date:</b> ${r.date} <span class="mut" style="font-size:10px">(${bsLabel(r.date)})</span></td></tr><tr><td><b>Student:</b> ${esc(r.studentName)}</td><td style="text-align:right"><b>Class:</b> ${esc(r.className)}</td></tr></table>`+
  (r.note?`<p style="font-size:11px;margin:0 0 8px">${esc(r.note)}</p>`:'')+
  tbl(['Particulars','Amount'],[['Tuition',h.tuition],['Admission fee',h.admission],['Annual fee',h.annual],['Activity fee',h.activity],['Library fee',h.library],['Exam fee',h.exam],['Transport',h.transport],['Other',h.other]].filter(x=>x[1]).map(x=>`<tr><td>${x[0]}</td><td class="num">${npr(x[1])}</td></tr>`).join('')+(r.discount?`<tr><td>Discount</td><td class="num">- ${npr(r.discount)}</td></tr>`:'')+`<tr><td><b>Net fee</b></td><td class="num"><b>${npr(r.net)}</b></td></tr><tr><td><b>Paid</b></td><td class="num"><b>${npr(r.paid)}</b></td></tr><tr><td>Balance</td><td class="num">${npr(r.net-r.paid)}</td></tr>`)+`<p style="margin-top:30px;text-align:right;font-size:11px">Authorised signature</p>`)}

/* ---- chart of accounts ---- */

  ${tbl(['Code','Title','Statement','Group','Balance',''],S.gl.slice().sort((a,b)=>order.indexOf(a.map)-order.indexOf(b.map)||a.code.localeCompare(b.code)).map(a=>`<tr><td class="pri-t"><b>${a.code}</b></td><td>${esc(a.title)}</td><td><span class="badge">${a.map.replace('_',' ')}</span></td><td>${esc(a.parent)}</td><td class="num"><b>${npr(m[a.code].nat)}</b></td>
  <td style="white-space:nowrap"><button class="btn sm" onclick="showDoc('Ledger',ledgerHTML('${a.code}','','${today()}'))">Ledger</button> <button class="btn sm" onclick="openGLForm('${a.code}')">Edit</button> ${a.sys?'':`<button class="btn sm dan" onclick="delGL('${a.code}')">Delete</button>`}</td></tr>`).join(''))}</div>`;

   ${fld('Statement',`<select class="inp" name="map" ${a.sys?'disabled':''}>${opt([['BS_ASSET','Balance sheet: Asset'],['BS_LIABILITY','Balance sheet: Liability'],['BS_EQUITY','Balance sheet: Equity'],['PL_INCOME','P&L: Income'],['PL_EXPENSE','P&L: Expense']],x=>x[0],x=>x[1],a.map)}</select>`)}
   ${fld('Group / sub-ledger',`<input class="inp" name="parent" required value="${esc(a.parent)}">`)}

function saveGL(e,orig){const f=fd(e);if(orig&&glOf(orig).sys)f.map=glOf(orig).map;

function delGL(code){if(confirm('Delete account '+code+'?'))dispatch('DEL_GL',{code},'Delete account '+code,'GL')}

VIEWS.journal=()=>{
  let vs=S.vouchers.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));if(UI.jf)vs=vs.filter(v=>v.date>=UI.jf);if(UI.jt)vs=vs.filter(v=>v.date<=UI.jt);

   <button class="btn ok" onclick="openVoucherForm()">Post voucher</button></div>

   <td style="white-space:nowrap">${i?'':(v.type==='JV'?`<button class="btn sm" onclick="openVoucherForm('${v.id}')">Edit</button> <button class="btn sm dan" onclick="delVoucher('${v.id}')">Delete</button>`:v.type==='BANK'?`<button class="btn sm dan" onclick="delVoucher('${v.id}')">Delete</button>`:'<span class="mut" style="font-size:10px">managed in its module</span>')}</td></tr>`).join('')).join(''),'No vouchers in this period.')}</div>`;
};
function openVoucherForm(id){
  const v=id?S.vouchers.find(x=>x.id===id):null,dr=v?v.lines.find(l=>l.dr):null,cr=v?v.lines.find(l=>l.cr):null,al=x=>opt(S.gl,a=>a.code,a=>a.code+' - '+a.title,x);

   ${fld('Amount (NPR) *',`<input class="inp" type="number" name="amount" required min="0.01" step="0.01" value="${dr?dr.dr:''}">`,'col-span-2')}${fld('Narration *',`<input class="inp" name="narration" required value="${v?esc(v.narration):''}">`,'col-span-2')}
   <div class="col-span-2" style="text-align:right"><button type="button" class="btn" onclick="closeModal()">Cancel</button> <button class="btn ok">${isChk()?'Post voucher':'Send for approval'}</button></div></form>`);

function saveVoucher(e,id){const f=fd(e);if(dispatch('SAVE_VOUCHER',{id:id||undefined,date:f.date,dr:f.dr,cr:f.cr,amount:f.amount,narration:f.narration.trim()},`Voucher: ${f.narration} (${npr(f.amount)})`,'JOURNAL'))closeModal()}
function delVoucher(id){if(confirm('Delete voucher '+id+'?'))dispatch('DEL_VOUCHER',{id},'Delete voucher '+id,'JOURNAL')}

/* ---- statements ---- */
VIEWS.statements=()=>{
  const st=UI.stmt,pl=plCalc(st.from||null,st.to),m=GLB(null,st.to);
  const side=map=>{let t=0;const rows=S.gl.filter(a=>a.map===map).map(a=>{const v=m[a.code].nat;t+=v;return`<tr><td>${a.code} ${esc(a.title)}</td><td class="num">${npr(v)}</td></tr>`}).join('');return{rows,t:r2(t)}};
  const A=side('BS_ASSET'),L=side('BS_LIABILITY'),E=side('BS_EQUITY'),cum=plCalc(null,st.to).net,tle=r2(L.t+E.t+cum);
  let td=0,tc=0;const tb=S.gl.map(a=>{const n=m[a.code].net;if(!n)return'';if(n>0)td+=n;else tc+=-n;return`<tr><td>${a.code} ${esc(a.title)}</td><td class="num">${n>0?npr(n):''}</td><td class="num">${n<0?npr(-n):''}</td></tr>`}).join('');
  return`<div class="card" style="margin-bottom:12px"><div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap"><div><label class="lbl">P&L from</label><input class="inp" type="date" value="${st.from}" onchange="UI.stmt.from=this.value;render()"></div>
   <div><label class="lbl">As of / to</label><input class="inp" type="date" value="${st.to}" onchange="UI.stmt.to=this.value;render()"></div><button class="btn pri" onclick="showDoc('Financial statements',$('#stmtBox').innerHTML)">Print</button></div></div>
   <div id="stmtBox" class="grid lg:grid-cols-3 gap-3">
   <div class="card"><b>Profit & loss</b><div class="mut" style="font-size:11px">${st.from||'Beginning'} to ${st.to}</div><div style="margin-top:8px">${tbl(['Income','Amount'],pl.inc.map(x=>`<tr><td>${x.a.code} ${esc(x.a.title)}</td><td class="num">${npr(x.v)}</td></tr>`).join('')+`<tr><td><b>Total income</b></td><td class="num pos"><b>${npr(pl.ti)}</b></td></tr>`)}
    ${tbl(['Expenses','Amount'],pl.exp.map(x=>`<tr><td>${x.a.code} ${esc(x.a.title)}</td><td class="num">${npr(x.v)}</td></tr>`).join('')+`<tr><td><b>Total expenses</b></td><td class="num neg"><b>${npr(pl.te)}</b></td></tr>`)}
    <p style="font-size:15px;font-weight:800;margin-top:8px">Net ${pl.net>=0?'surplus':'deficit'}: <span class="${pl.net>=0?'pos':'neg'}">${npr(Math.abs(pl.net))}</span></p></div></div>
   <div class="card"><b>Balance sheet</b><div class="mut" style="font-size:11px">As of ${st.to}</div><div style="margin-top:8px">${tbl(['Assets','Amount'],A.rows+`<tr><td><b>Total assets</b></td><td class="num"><b>${npr(A.t)}</b></td></tr>`)}
    ${tbl(['Liabilities & equity','Amount'],L.rows+E.rows+`<tr><td>Cumulative surplus / (deficit)</td><td class="num">${npr(cum)}</td></tr><tr><td><b>Total liabilities & equity</b></td><td class="num"><b>${npr(tle)}</b></td></tr>`)}
    <p class="${Math.abs(A.t-tle)<0.01?'pos':'neg'}" style="font-weight:700;margin-top:8px">${Math.abs(A.t-tle)<0.01?'Balanced':'Out of balance by '+npr(A.t-tle)}</p></div></div>
   <div class="card"><b>Trial balance</b><div class="mut" style="font-size:11px">As of ${st.to}</div><div style="margin-top:8px">${tbl(['Account','Debit','Credit'],tb+`<tr><td><b>Totals</b></td><td class="num"><b>${npr(td)}</b></td><td class="num"><b>${npr(tc)}</b></td></tr>`)}
    <p class="${Math.abs(td-tc)<0.01?'pos':'neg'}" style="font-weight:700;margin-top:8px">${Math.abs(td-tc)<0.01?'Debits equal credits':'Difference '+npr(td-tc)+' (check opening balances)'}</p></div></div></div>`;
};

/* ---- treasury ---- */

  const T=UI.trTab;if(!UI.bankId||!bankOf(UI.bankId))UI.bankId=(S.banks[0]||{}).id||'';
  const tabs=[['accounts','Bank accounts'],['txns','Transactions'],['stmt','Bank statement']].map(t=>`<button class="${T===t[0]?'act':''}" onclick="UI.trTab='${t[0]}';render()">${t[1]}</button>`).join('');
  const bsel=`<div style="min-width:240px">${fld('Account',`<select class="inp" onchange="UI.bankId=this.value;UI.editTxn=null;render()">${opt(S.banks,b=>b.id,b=>b.name+' ('+(b.type==='BANK'?'Bank':'Loan')+')',UI.bankId)}</select>`)}</div>`;
  let body='';
  if(T==='accounts'){const m=GLB(null,null);
    body=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>Bank accounts & loan facilities</b><button class="btn pri" onclick="openBankForm()">Add bank / loan</button></div>
    ${tbl(['Bank','Type','Account','GL code','Balance',''],S.banks.map(b=>`<tr><td><b>${esc(b.name)}</b></td><td><span class="badge ${b.type==='BANK'?'ok':'warn'}">${b.type==='BANK'?'Bank':'Loan'}</span></td><td>${esc(b.acc)}</td><td>${b.glCode}</td><td class="num"><b>${npr(m[b.glCode].nat)}</b></td>
    <td style="white-space:nowrap"><button class="btn sm" onclick="UI.bankId='${b.id}';UI.trTab='stmt';render()">Statement</button> <button class="btn sm" onclick="openBankForm('${b.id}')">Edit</button> <button class="btn sm dan" onclick="delBank('${b.id}')">Delete</button></td></tr>`).join(''),'No bank accounts yet.')}</div>`}
  if(T==='txns'){const b=bankOf(UI.bankId);
    if(!b)body='<div class="card">Add a bank account first.</div>';
    else{const ed=UI.editTxn?S.vouchers.find(v=>v.id===UI.editTxn):null,mt=ed&&ed.meta||{},isB=b.type==='BANK';
      const contra=S.gl.filter(a=>a.code!==b.glCode);
      const vs=S.vouchers.filter(v=>v.lines.some(l=>l.code===b.glCode)).sort((x,y)=>y.date.localeCompare(x.date)||y.id.localeCompare(x.id));
      body=`${bsel}<div class="grid lg:grid-cols-3 gap-3 mt-2"><div class="card"><b>${ed?'Edit transaction '+ed.id:'New transaction'}</b>
      <form onsubmit="submitBankTxn(event)" class="grid grid-cols-2 gap-2" style="margin-top:10px">
      ${fld('Date *',`<input class="inp" type="date" name="date" required value="${ed?ed.date:today()}">`)}${fld('Reference / cheque no',`<input class="inp" name="refNo" value="${esc(mt.refNo||'')}">`)}
      ${fld('Type *',`<select class="inp" name="side">${opt(isB?[['DR','Deposit / receipt (money in)'],['CR','Withdrawal / payment (money out)']]:[['CR','Loan drawdown (liability up)'],['DR','Repayment (liability down)']],x=>x[0],x=>x[1],mt.side||(isB?'DR':'CR'))}</select>`,'col-span-2')}
      ${fld('Amount (NPR) *',`<input class="inp" type="number" name="amount" required min="0.01" step="0.01" value="${ed?ed.lines.reduce((s,l)=>s+(l.dr||0),0):''}">`,'col-span-2')}
      ${fld('Other side / contra account *',`<select class="inp" name="contra">${opt(contra,a=>a.code,a=>a.code+' - '+a.title,mt.contra)}</select>`,'col-span-2')}
      ${fld('Narration *',`<input class="inp" name="narration" required value="${ed?esc(ed.narration):''}">`,'col-span-2')}
      <button class="btn ok" style="padding:9px" type="submit">${ed?'Update transaction':isChk()?'Post transaction':'Send for approval'}</button>${ed?`<button type="button" class="btn" onclick="UI.editTxn=null;render()">Cancel edit</button>`:''}</form></div>
      <div class="lg:col-span-2 card"><b>${esc(b.name)} transactions</b><div style="margin-top:8px">${tbl(['Date','Voucher','Particulars','Debit','Credit',''],vs.map(v=>{const l=v.lines.find(x=>x.code===b.glCode);
        return`<tr><td>${v.date}</td><td>${v.id} <span class="badge">${v.type}</span></td><td>${esc(v.narration)}${v.meta&&v.meta.refNo?` <span class="mut">(Ref ${esc(v.meta.refNo)})</span>`:''}</td><td class="num">${l.dr?npr(l.dr):''}</td><td class="num">${l.cr?npr(l.cr):''}</td>
        <td style="white-space:nowrap">${v.type==='BANK'&&v.ref.bankId===b.id?`<button class="btn sm" onclick="UI.editTxn='${v.id}';render()">Edit</button> <button class="btn sm dan" onclick="delVoucher('${v.id}')">Delete</button>`:'<span class="mut" style="font-size:10px">from '+v.type.toLowerCase()+'</span>'}</td></tr>`}).join(''),'No transactions yet.')}</div></div></div>`}}
  if(T==='stmt'){const b=bankOf(UI.bankId);
    body=!b?'<div class="card">Add a bank account first.</div>':`<div class="card"><div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px">${bsel}<div>${fld('From date',`<input class="inp" type="date" value="${UI.from}" onchange="UI.from=this.value;render()">`)}</div><div>${fld('To date',`<input class="inp" type="date" value="${UI.to}" onchange="UI.to=this.value;render()">`)}</div>
      <button class="btn pri" onclick="showDoc('Bank statement',docHead('Bank statement - ${esc(b.name)}')+ledgerHTML('${b.glCode}',UI.from,UI.to))">Print statement</button></div>${ledgerHTML(b.glCode,UI.from,UI.to)}</div>`}
  return`<div class="tabs">${tabs}</div>`+body;
};
function openBankForm(id){
  const b=id?bankOf(id):{type:'BANK',name:'',acc:''};
  openModal(id?'Edit bank account':'Add bank / loan',`<form onsubmit="saveBank(event,'${id||''}')" class="grid grid-cols-2 gap-3">

function hrPayroll(){
  const P=UI.pay,recs=S.payroll.slice(0,60);
  return`<div class="card"><b>Post salary</b><p class="mut" style="margin:2px 0 10px;font-size:12px">Auto: load every unpaid staff member for the month. Manual: add one person and edit any amount. TDS follows the FY ${esc(S.tax.fy)} slabs in the Tax & SSF tab.</p>
   <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${fld('Salary month',`<input class="inp" type="month" value="${P.month}" onchange="UI.pay.month=this.value">`)}${fld('Payment date',`<input class="inp" type="date" value="${P.date}" onchange="UI.pay.date=this.value">`)}
    ${fld('Pay from',`<select class="inp" onchange="UI.pay.mode=this.value">${payOpts(P.mode)}</select>`)}
    <div style="display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap"><button class="btn pri" onclick="payAuto()">Auto: all staff</button></div></div>
   <div style="display:flex;gap:8px;align-items:flex-end;margin:10px 0"><div style="min-width:240px">${fld('Manual: add one staff member',`<select id="payAddSel" class="inp">${opt(S.employees,e=>e.id,e=>e.name+' ('+e.role+')','')}</select>`)}</div><button class="btn" onclick="payManual()">Add row</button></div>
   ${UI.payDraft.length?`<div class="overflow-x-auto"><table class="tbl"><thead><tr><th>Staff</th><th>Basic</th><th>Allowance</th><th>Bonus</th><th>Other ded.</th><th>Advance recovery</th><th>Gross</th><th>SSF (11%)</th><th>TDS</th><th>Net pay</th><th></th></tr></thead><tbody>${UI.payDraft.map((r,i)=>{const e=empOf(r.empId);
   const inp=(f)=>`<td><input class="inp" style="width:92px" type="number" min="0" value="${r[f]}" oninput="payEdit(${i},'${f}',this.value)"></td>`;
   return`<tr><td><b>${esc(e.name)}</b><div class="mut" style="font-size:10px">Advance due ${npr(advOut(e.id))}</div></td>${inp('basic')}${inp('allow')}${inp('bonus')}${inp('other')}${inp('advRec')}<td class="num" id="pcG${i}"></td><td class="num" id="pcS${i}"></td><td class="num" id="pcT${i}"></td><td class="num pos" id="pcN${i}"></td><td><button class="btn sm dan" onclick="UI.payDraft.splice(${i},1);render()">Remove</button></td></tr>`}).join('')}
   <tr><td colspan="6"><b>Total net payable</b></td><td class="num" id="pcTG"></td><td></td><td class="num" id="pcTT"></td><td class="num pos" id="pcTN"></td><td></td></tr></tbody></table></div>
   <div style="text-align:right;margin-top:10px"><button class="btn ok" onclick="postPayroll()">${isChk()?'Post payroll':'Send payroll for approval'}</button></div>`:'<p class="mut">No rows yet. Use Auto or add a staff member manually.</p>'}</div>
   <div class="card mt-3"><b>Posted salaries</b><div style="margin-top:8px">${tbl(['Slip','Month','Staff','Gross','SSF','TDS','Advance','Net paid',''],recs.map(r=>`<tr><td>${r.id}</td><td>${r.month}</td><td>${esc(r.empName)}</td><td class="num">${npr(r.gross)}</td><td class="num">${npr(r.empSSF)}</td><td class="num">${npr(r.tds)}</td><td class="num">${npr(r.advRec)}</td><td class="num pos">${npr(r.net)}</td>
   <td style="white-space:nowrap"><button class="btn sm" onclick="printPayslip('${r.id}')">Payslip</button> <button class="btn sm dan" onclick="delPayroll('${r.id}')">Delete</button></td></tr>`).join(''),'No salaries posted yet.')}</div></div>`;
}
function payRow(e){return{empId:e.id,basic:e.basePay,allow:e.allowance||0,bonus:0,other:0,advRec:0}}
function payAuto(){const paid=new Set(S.payroll.filter(p=>p.month===UI.pay.month).map(p=>p.empId));UI.payDraft=S.employees.filter(e=>!paid.has(e.id)).map(payRow);if(!UI.payDraft.length)toast('Everyone is already paid for '+UI.pay.month,true);render()}
function payManual(){const id=$('#payAddSel').value;if(!id)return;if(UI.payDraft.some(r=>r.empId===id)){toast('Already in the list',true);return}
  if(S.payroll.some(p=>p.empId===id&&p.month===UI.pay.month)){toast('Already paid for '+UI.pay.month,true);return}UI.payDraft.push(payRow(empOf(id)));render()}
function payCalcRow(i){const r=UI.payDraft[i],e=empOf(r.empId);return calcPay(e,{...r,advRec:Math.min(num(r.advRec),advOut(e.id))})}
function payEdit(i,f,v){UI.payDraft[i][f]=v;payRefresh(i);payTotals()}
function payRefresh(i){const c=payCalcRow(i),set=(id,v,neg)=>{const el=$('#'+id+i);if(el)el.textContent=npr(v)};set('pcG',c.gross);set('pcS',c.empSSF);set('pcT',c.tds);set('pcN',c.net);const n=$('#pcN'+i);if(n)n.className='num '+(c.net<0?'neg':'pos')}
function payTotals(){let g=0,t=0,n=0;UI.payDraft.forEach((r,i)=>{const c=payCalcRow(i);g+=c.gross;t+=c.tds;n+=c.net});const s=(id,v)=>{const el=$('#'+id);if(el)el.textContent=npr(v)};s('pcTG',g);s('pcTT',t);s('pcTN',n)}
function postPayroll(){if(!UI.payDraft.length)return;const P=UI.pay;if(!P.month||!P.date){alert('Choose month and payment date.');return}
  for(let i=0;i<UI.payDraft.length;i++)if(payCalcRow(i).net<0){alert('A net pay is negative. Reduce the deductions.');return}
  if(dispatch('POST_PAYROLL',{month:P.month,date:P.date,mode:P.mode,list:UI.payDraft.map(r=>({...r}))},`Payroll ${P.month}: ${UI.payDraft.length} staff`,'HR')){UI.payDraft=[];render()}}
function delPayroll(id){if(confirm('Delete this salary entry and reverse its accounting?'))dispatch('DEL_PAYROLL',{id},'Delete salary '+id,'HR')}
function printPayslip(id){const r=S.payroll.find(x=>x.id===id);if(!r)return;
  showDoc('Payslip',docHead('Salary slip - '+r.month)+`<p style="font-size:12px"><b>Name:</b> ${esc(r.empName)} &nbsp; <b>Post:</b> ${esc(r.role)} &nbsp; <b>Slip:</b> ${r.id} &nbsp; <b>Paid on:</b> ${r.date}</p>`+
  tbl(['Earnings','Amount','Deductions','Amount'],`<tr><td>Basic salary</td><td class="num">${npr(r.basic)}</td><td>SSF employee contribution</td><td class="num">${npr(r.empSSF)}</td></tr><tr><td>Allowance</td><td class="num">${npr(r.allow)}</td><td>Income tax (TDS)</td><td class="num">${npr(r.tds)}</td></tr><tr><td>Bonus / other</td><td class="num">${npr(r.bonus)}</td><td>Advance recovery</td><td class="num">${npr(r.advRec)}</td></tr><tr><td></td><td></td><td>Other deductions</td><td class="num">${npr(r.other)}</td></tr>
  <tr><td><b>Gross</b></td><td class="num"><b>${npr(r.gross)}</b></td><td><b>Total deductions</b></td><td class="num"><b>${npr(r.empSSF+r.tds+r.advRec+r.other)}</b></td></tr>`)+`<p style="font-size:15px;font-weight:800;margin-top:10px">Net pay: ${npr(r.net)}</p><p style="font-size:10px">Employer SSF contribution ${npr(r.erSSF)} is paid by the school in addition. Annual taxable income used for TDS: ${npr(r.taxable)}.</p>`)}

function hrAdvances(){
  return`<div class="grid lg:grid-cols-3 gap-3"><div class="card"><b>Issue staff advance</b><form onsubmit="submitAdvance(event)" class="grid grid-cols-2 gap-2" style="margin-top:10px">
   ${fld('Staff *',`<select class="inp" name="empId" required>${opt(S.employees,e=>e.id,e=>e.name,'')}</select>`,'col-span-2')}${fld('Amount *',`<input class="inp" type="number" min="1" name="amount" required>`)}${fld('Date *',`<input class="inp" type="date" name="date" required value="${today()}">`)}
   ${fld('Pay from',`<select class="inp" name="mode">${payOpts('CASH')}</select>`,'col-span-2')}${fld('Note',`<input class="inp" name="note">`,'col-span-2')}<button class="btn pri col-span-2" style="padding:9px">${isChk()?'Issue advance':'Send for approval'}</button></form>
   <p class="mut" style="font-size:11px;margin-top:8px">Recover it by entering an amount in "Advance recovery" when posting salary.</p></div>
   <div class="lg:col-span-2 card"><b>Advances</b><div style="margin-top:8px">${tbl(['ID','Staff','Date','Amount','Recovered','Outstanding',''],S.advances.map(a=>`<tr><td>${a.id}</td><td>${esc((empOf(a.empId)||{}).name)}</td><td>${a.date}</td><td class="num">${npr(a.amount)}</td><td class="num">${npr(a.recovered)}</td><td class="num ${a.amount-a.recovered>0?'warn-t':'pos'}">${npr(a.amount-a.recovered)}</td><td><button class="btn sm dan" onclick="delAdv('${a.id}')">Delete</button></td></tr>`).join(''),'No advances.')}</div></div></div>`;
}
function submitAdvance(e){const f=fd(e);if(dispatch('ISSUE_ADV',{empId:f.empId,amount:f.amount,date:f.date,mode:f.mode,note:f.note},`Advance ${npr(f.amount)} to ${(empOf(f.empId)||{}).name}`,'HR'))e.target.reset()}
function delAdv(id){if(confirm('Delete this advance?'))dispatch('DEL_ADV',{id},'Delete advance '+id,'HR')}

function hrTax(){
  const T=S.tax;
  return`<div class="grid lg:grid-cols-3 gap-3"><div class="card lg:col-span-2"><b>Income tax slabs (annual taxable income)</b>
   <p class="mut" style="font-size:12px;margin:4px 0 10px">Preloaded with FY ${esc(T.fy)} (from 1 Shrawan 2083): 1% up to Rs 10 lakh, then 10%, 20%, 27%, 29%, one table for everyone. Confirm against the gazetted Finance Act 2083 / IRD notice and edit here if anything differs.</p>
   <form onsubmit="saveTax(event)"><div class="grid grid-cols-2 gap-3" style="max-width:420px">${fld('Fiscal year label',`<input class="inp" name="fy" value="${esc(T.fy)}">`,'col-span-2')}</div>
   <table class="tbl" style="max-width:520px;margin-top:8px"><thead><tr><th>Slab</th><th>Up to (NPR, blank = no limit)</th><th>Rate %</th></tr></thead><tbody>${T.slabs.map((s,i)=>`<tr><td>${i+1}</td><td><input class="inp" type="number" name="upto${i}" value="${s.upto==null?'':s.upto}"></td><td><input class="inp" type="number" step="0.1" name="rate${i}" value="${s.rate}"></td></tr>`).join('')}</tbody></table>
   <div class="grid grid-cols-2 lg:grid-cols-4 gap-3" style="margin-top:12px">${fld('SSF employee %',`<input class="inp" type="number" step="0.01" name="ssfEmp" value="${T.ssfEmp}">`)}${fld('SSF employer %',`<input class="inp" type="number" step="0.01" name="ssfEr" value="${T.ssfEr}">`)}${fld('Retirement deduction cap',`<input class="inp" type="number" name="retCap" value="${T.retCap}">`)}
   ${fld('1% slab waived for SSF',`<select class="inp" name="waive">${opt([['1','Yes'],['0','No']],x=>x[0],x=>x[1],T.waiveFirst?'1':'0')}</select>`)}</div>
   <div style="margin-top:12px"><button class="btn pri">${isChk()?'Save tax settings':'Send for approval'}</button></div></form></div>
   <div class="card"><b>Try a calculation</b><div style="margin-top:10px">${fld('Monthly gross (basic + allowance)',`<input id="tcG" class="inp" type="number" value="50000" oninput="taxTest()">`)}${fld('Basic part of it',`<input id="tcB" class="inp" type="number" value="45000" oninput="taxTest()">`,'mt-2')}
   <label style="display:flex;gap:8px;margin-top:8px"><input type="checkbox" id="tcS" checked onchange="taxTest()"> SSF enrolled</label><div id="tcOut" style="margin-top:10px;background:var(--panel2);padding:10px;border-radius:8px;font-size:12px"></div></div>
   <p class="mut" style="font-size:11px;margin-top:10px">TDS = annual tax on (monthly gross + employer SSF) x 12, less the retirement deduction (lowest of contributions, cap, one third of income), divided by 12.</p></div></div>`;
}
function taxTest(){const g=num($('#tcG').value),b=num($('#tcB').value),c=calcPay({ssf:$('#tcS').checked},{basic:b,allow:Math.max(0,g-b)});
  $('#tcOut').innerHTML=`Annual taxable income: <b>${npr(c.taxable)}</b><br>Annual tax: <b>${npr(c.annualTax)}</b><br>Monthly TDS: <b>${npr(c.tds)}</b><br>Employee SSF: ${npr(c.empSSF)} / Employer SSF: ${npr(c.erSSF)}<br>Net monthly pay: <b class="pos">${npr(c.net)}</b>`}
function saveTax(e){const f=fd(e),slabs=S.tax.slabs.map((s,i)=>({upto:f['upto'+i]===''?null:num(f['upto'+i]),rate:num(f['rate'+i])}));
  for(let i=0;i<slabs.length-1;i++)if(slabs[i].upto==null||(i&&slabs[i].upto<=slabs[i-1].upto)){alert('Slab limits must increase; only the last slab can be open-ended.');return}
  slabs[slabs.length-1].upto=null;
  dispatch('SAVE_TAX',{tax:{fy:f.fy,slabs,waiveFirst:f.waive==='1',ssfEmp:num(f.ssfEmp),ssfEr:num(f.ssfEr),retCap:num(f.retCap)}},'Update tax settings FY '+f.fy,'HR')}
